<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070d3c;color:#fff;font:700 18px Arial}body{display:grid;place-items:center}main{position:relative;width:min(1100px,100vw);height:min(620px,100vh);overflow:hidden;text-align:center;background:radial-gradient(#164da8,#120a3d);border:3px solid #00eaff;box-shadow:0 0 40px #00eaff}.home{padding-top:22px}.logo{font:bold clamp(32px,7vw,78px) Arial;color:#ffe83b;-webkit-text-stroke:5px #111;text-shadow:0 8px #df7800,5px 12px #000}.row{display:flex;justify-content:center;align-items:center;gap:28px;margin:25px}.asset{border:5px solid #10182d;box-shadow:inset 0 0 0 4px #d4f5ff,0 7px #030817,0 0 23px #00eaff;cursor:pointer}.kit{width:108px;height:108px;border-radius:18px;background:linear-gradient(#fff66c,#d7a400)}.play{width:174px;height:174px;border-radius:50%;background:linear-gradient(145deg,#b8ff63,#1bc544 60%,#087326);font-size:0}.play:after{content:'';display:inline-block;border-left:54px solid #ffe72e;border-top:34px solid transparent;border-bottom:34px solid transparent;margin-left:12px;filter:drop-shadow(3px 3px #111)}.create{width:108px;height:108px;border-radius:50%;background:linear-gradient(145deg,#62d5ff,#1164bf);color:#e8f8ff;font-size:48px;text-shadow:3px 3px #17213b}.menu{margin-top:46px;color:#ffe83b;font-size:34px}.select,.game{display:none;position:absolute;inset:0;background:#07184ff2;padding:25px}.show{display:block}.card{margin:36px auto;padding:22px;width:min(440px,75vw);background:linear-gradient(#397fde,#123688);border:4px solid #ffe83b;border-radius:18px}.card h2{color:#ffe83b;text-shadow:2px 2px #111}.card button,.back{border:0;border-radius:25px;padding:12px 27px;background:linear-gradient(#68ff99,#10b94c);box-shadow:0 5px #08722f;color:#fff;font-weight:bold;cursor:pointer}.game canvas{width:100%;height:100%}.hud{position:absolute;top:14px;left:22px;right:22px;display:flex;justify-content:space-between;text-shadow:0 3px #000}.back{position:absolute;bottom:16px;left:16px}</style><main><section id=home class=home><div class=logo>GEOMETRY DASH</div><div class=row><button class="asset kit" id=kit aria-label="Icon kit"><svg width=72 height=72 viewBox="0 0 72 72"><rect x=6 y=6 width=60 height=60 rx=10 fill="#ffe33b" stroke="#12e4db" stroke-width=6/><path d="M20 26h9v9h-9zm23 0h9v9h-9zM22 45q14 10 28 0" fill="#14203d" stroke="#14203d" stroke-width=4/></svg></button><button class="asset play" id=play aria-label="Play"><svg width=110 height=110 viewBox="0 0 110 110"><path d="M55 8v20M55 82v20M8 55h20M82 55h20M22 22l14 14M74 74l14 14M88 22L74 36M36 74L22 88" stroke="#42b7ff" stroke-width=11 stroke-linecap="round"/><path d="M47 30l38 25-38 25z" fill="#ffe72e" stroke="#111" stroke-width=5/></svg></button><button class="asset create" id=create aria-label="Create"><svg width=78 height=78 viewBox="0 0 78 78"><path d="M17 63l35-35 9 9-35 35zM50 18l7-7 12 12-7 7z" fill="#dcecff" stroke="#14213b" stroke-width=5/><path d="M15 24l39 39M18 16l10 2 2 10M60 51l2 10-10 2" stroke="#dcecff" stroke-width=7" stroke-linecap="round"/></svg></button></div><div class=menu>♜　◆　⚙　ⓘ</div></section><section id=select class=select><h1>SELECT LEVEL</h1><div class=card><h2>STEREO MADNESS</h2><div>★ EASY　 NORMAL ▰▱▱▱▱</div><p>PRACTICE ▱▱▱▱▱　◯ ◯ ◯</p><button id=launch>PLAY</button></div><button class=back id=selectBack>HOME</button></section><section id=game class=game><canvas id=canvas width=960 height=540></canvas><div class=hud><span>STEREO MADNESS</span><span>ATTEMPT <b id=attempt>1</b> · <b id=pct>0</b>%</span></div><button class=back id=quit>LEVELS</button></section><script>const $=x=>document.getElementById(x),ctx=canvas.getContext('2d');let hero,blocks,spikes,dead=0,last=0;play.onclick=()=>{home.style.display='none';select.classList.add('show')};selectBack.onclick=()=>{select.classList.remove('show');home.style.display='block'};quit.onclick=()=>{game.classList.remove('show');select.classList.add('show')};launch.onclick=()=>{select.classList.remove('show');game.classList.add('show');reset()};function reset(){hero={x:100,y:400,w:32,h:32,vy:0,on:true};blocks=[{x:500,y:335,w:70,h:97},{x:700,y:285,w:75,h:147},{x:930,y:350,w:110,h:82},{x:1220,y:300,w:80,h:132}];spikes=[{x:380,y:396,w:38,h:36},{x:610,y:299,w:38,h:36},{x:840,y:396,w:38,h:36},{x:1090,y:396,w:38,h:36}];dead=0}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function die(){if(dead)return;dead=1;setTimeout(()=>{reset();attempt.textContent=+attempt.textContent+1},360)}function jump(){if(!dead&&hero.on){hero.vy=-860;hero.on=false}}addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});canvas.addEventListener('pointerdown',jump);function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(game.classList.contains('show')&&!dead){let oldBottom=hero.y+hero.h;hero.vy+=2300*dt;hero.y+=hero.vy*dt;hero.on=false;if(hero.y+hero.h>=432){hero.y=400;hero.vy=0;hero.on=true}for(const b of blocks){if(hit(hero,b)){if(hero.vy>=0&&oldBottom<=b.y+10){hero.y=b.y-hero.h;hero.vy=0;hero.on=true}else if(hero.x+hero.w>b.x&&hero.x<b.x+12)die()}}for(const s of spikes)if(hit({x:hero.x+6,y:hero.y+6,w:20,h:22},s))die();hero.x+=275*dt;pct.textContent=Math.min(100,hero.x/1500*100)|0}draw();requestAnimationFrame(loop)}function draw(){ctx.fillStyle='#123a8e';ctx.fillRect(0,0,960,540);ctx.save();ctx.translate(-Math.max(0,hero.x-170),0);ctx.fillStyle='#001848';ctx.fillRect(0,432,2500,108);ctx.fillStyle='#00eaff';ctx.fillRect(0,432,2500,6);blocks.forEach(b=>{ctx.fillStyle='#394473';ctx.strokeStyle='#32eaff';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeRect(b.x,b.y,b.w,b.h)});spikes.forEach(s=>{ctx.fillStyle='#151827';ctx.strokeStyle='#00eaff';ctx.beginPath();ctx.moveTo(s.x,432);ctx.lineTo(s.x+19,s.y);ctx.lineTo(s.x+38,432);ctx.closePath();ctx.fill();ctx.stroke()});ctx.fillStyle='#ffe43b';ctx.strokeStyle='#1de3df';ctx.lineWidth=4;ctx.fillRect(hero.x,hero.y,hero.w,hero.h);ctx.strokeRect(hero.x,hero.y,hero.w,hero.h);ctx.restore()}reset();requestAnimationFrame(loop)</script></main>
