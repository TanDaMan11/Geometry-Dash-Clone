<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#001030;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}main{position:relative;width:min(1120px,100vw);height:min(630px,100vh);overflow:hidden;background:radial-gradient(circle at 50% 35%,#073c96,#06215e 45%,#16072e);border:3px solid #00eaff;box-shadow:0 0 40px #00eaff88}.grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(45deg,transparent 48%,#55bfff 49%,transparent 51%),linear-gradient(-45deg,transparent 48%,#55bfff 49%,transparent 51%);background-size:80px 80px;animation:g 8s linear infinite}@keyframes g{to{background-position:80px 80px}}.logo{text-align:center;margin:25px auto 5px;font-size:clamp(32px,7vw,78px);font-weight:1000;letter-spacing:-5px;color:#ffe83b;-webkit-text-stroke:5px #111;text-shadow:0 8px #e27b00,5px 12px #000}.home,.select{position:relative;z-index:1;text-align:center}.row{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:28px}.icon{border:5px solid #121a2e;box-shadow:inset 0 0 0 4px #bde4ff,0 7px #050817,0 0 22px #00dfff88;cursor:pointer}.garage{width:105px;height:105px;background:#ffe234;border-radius:18px;font-size:55px}.play{width:165px;height:165px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#baff68,#22c947 58%,#078221);font-size:0}.play:after{content:'';display:inline-block;border-left:48px solid #ffe83b;border-top:30px solid transparent;border-bottom:30px solid transparent;margin-left:12px;filter:drop-shadow(3px 4px #111)}.create{width:105px;height:105px;border-radius:50%;background:#268ce8;font-size:50px}.bottom{display:flex;justify-content:center;gap:16px;margin-top:52px}.utility{width:64px;height:64px;border-radius:12px;background:#238de6;color:#ffe83b;font-size:32px;border:4px solid #111a2f;box-shadow:inset 0 0 0 3px #9ceaff,0 5px #050817}.chest{position:absolute;right:25px;top:240px;width:72px;height:72px;border-radius:15px;background:#c77b22;border:5px solid #ffd83d;font-size:35px}.select{display:none;position:absolute;inset:0;background:#07184fee;padding:25px}.select.show{display:block}.select h2{font-size:40px;color:#ffe83b;text-shadow:3px 4px #000}.cards{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.level{width:170px;padding:14px;color:#fff;background:#164cbd;border:3px solid #ffe83b;border-radius:12px;font-weight:bold;cursor:pointer}.level small{display:block;color:#8cffae;margin-top:8px}.back,.start{border:0;border-radius:30px;padding:13px 29px;margin:25px 8px;background:linear-gradient(#69ff99,#12b852);box-shadow:0 5px #08752e;font-weight:bold;cursor:pointer}.game{display:none;position:absolute;inset:0;z-index:3}.game.show{display:block}.hud{position:absolute;top:15px;left:25px;right:25px;display:flex;justify-content:space-between;font-weight:bold;text-shadow:0 3px #000;z-index:2}.pause{background:#111d4ddd;color:#fff;border:0;font-size:18px}.hint{position:absolute;bottom:8px;width:100%;font-size:11px;color:#bcecff}</style></head><body><main><div class=grid></div><section id=home class=home><div class=logo>GEOMETRY DASH</div><div class=row><button class="icon garage">◆</button><button class="icon play" id=play></button><button class="icon create">⚒</button></div><button class=chest>♜</button><div class=bottom><button class=utility>♜</button><button class=utility>◆</button><button class=utility>⚙</button><button class=utility>ⓘ</button></div><div class=hint>SELECT A LEVEL TO PLAY</div></section><section id=select class=select><h2>SELECT LEVEL</h2><div class=cards id=cards></div><button class=back id=back>BACK</button></section><section id=game class=game><canvas id=c width=960 height=540></canvas><div class=hud>ATTEMPT <span id=attempt>1</span><span><span id=percent>0</span>% <button class=pause id=pa>Ⅱ</button></span></div><button class=start id=restart>RESTART</button></section><script>const $=s=>document.querySelector(s),c=$('#c'),x=c.getContext('2d'),W=960,H=540,G=432,FIN=6200;let mode='menu',level=0,last=0,cam=0,hero,objects=[],bits=[],shake=0,flash=0;let names=['STEREO MADNESS','BACK ON TRACK','POLARGEIST','DRY OUT','BASE AFTER BASE'];function cards(){ $('#cards').innerHTML=names.map((n,i)=>`<button class=level data-i=${i}>${n}<br>◆ ${'★'.repeat(i+1)}<small>NORMAL ▰▱▱▱▱<br>PRACTICE ▱▱▱▱▱<br>◯ ◯ ◯</small></button>`).join('');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>start(+b.dataset.i))}cards();function reset(){hero={x:120,y:G-36,w:36,h:36,vy:0,r:0,ground:1};cam=0;objects=[];let z=600;while(z<FIN){let type=z%900<250?'spike':z%900<500?'step':z%900<650?'pad':'orb';objects.push({type,x:z,w:38,h:type==='step'?70+z%100:36});if(type==='spike'&&z%700<300)objects.push({type:'spike',x:z+45,w:38,h:36});if(type==='step')objects.push({type:'spike',x:z+18,w:38,h:36});z+=115+(z%190)}}function start(i=level){level=i;reset();mode='play';$('#home').style.display='none';$('#select').classList.remove('show');$('#game').classList.add('show')}function box(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function burst(){for(let i=0;i<40;i++)bits.push({x:hero.x+18,y:hero.y+18,vx:(Math.random()-.5)*500,vy:(Math.random()-.7)*500,l:.6})}function die(){if(mode!=='play')return;mode='respawn';shake=15;flash=.3;burst();setTimeout(()=>{reset();mode='play';$('#attempt').textContent=+$('#attempt').textContent+1},500)}function update(dt){bits.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=800*dt;p.l-=dt});bits=bits.filter(p=>p.l>0);flash=Math.max(0,flash-dt);if(mode!=='play')return;hero.vy+=2450*dt;hero.y+=hero.vy*dt;hero.ground=0;if(hero.y>=G-hero.h){hero.y=G-hero.h;hero.vy=0;hero.ground=1;hero.r=Math.round(hero.r/(Math.PI/2))*Math.PI/2}for(const o of objects){let r=o.type==='spike'?{x:o.x+6,y:G-o.h+9,w:26,h:27}:o.type==='step'?{x:o.x,y:G-o.h,w:o.w,h:o.h}:o.type==='pad'?{x:o.x,y:G-15,w:38,h:15}:{x:o.x,y:G-125,w:24,h:24};if(o.type==='pad'&&box(hero,r))hero.vy=-1120;else if(o.type==='orb'&&box(hero,r)&&hero.vy>0)hero.vy=-1050;else if((o.type==='spike'||o.type==='step')&&box({x:hero.x+6,y:hero.y+6,w:24,h:24},r))return die()}hero.x+=285*dt;hero.r=hero.ground?hero.r:hero.r+dt*8;cam=Math.max(0,hero.x-180);let p=Math.min(100,hero.x/FIN*100);$('#percent').textContent=p|0;if(hero.x>FIN){mode='menu';$('#game').classList.remove('show');$('#home').style.display='block'}}function draw(){let L=['#001133','#250044','#003c52','#5b2108','#073d24'][level],q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,L);q.addColorStop(1,'#09102e');x.fillStyle=q;x.fillRect(0,0,W,H);x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}x.translate(-cam,0);for(let i=-2;i<80;i++){x.fillStyle='#0066ff55';x.fillRect(i*100,100+i%5*35,3,3)}x.fillStyle='#001848';x.fillRect(0,G,FIN+500,108);x.fillStyle='#00ffff';x.fillRect(0,G,FIN+500,6);for(let i=0;i<90;i++){x.fillStyle=i%2?'#fff3':'#0005';x.fillRect(i*70,G+15,35,5)}objects.forEach(o=>{if(o.type==='spike'){x.fillStyle='#171a29';x.strokeStyle='#00dfff';x.lineWidth=3;x.beginPath();x.moveTo(o.x,G);x.lineTo(o.x+19,G-o.h);x.lineTo(o.x+38,G);x.closePath();x.fill();x.stroke()}else if(o.type==='step'){x.fillStyle='#353c66';x.fillRect(o.x,G-o.h,o.w,o.h);x.strokeStyle='#00aaff';x.lineWidth=4;x.strokeRect(o.x,G-o.h,o.w,o.h);x.strokeStyle='#a8b9de';x.lineWidth=2;x.strokeRect(o.x+8,G-o.h+8,o.w-16,o.h-16)}else if(o.type==='pad'){x.fillStyle='#ffe43b';x.beginPath();x.ellipse(o.x+19,G-5,20,10,0,Math.PI,0);x.fill()}else{x.strokeStyle='#fff';x.strokeWidth=3;x.strokeStyle='#ffe43b';x.beginPath();x.arc(o.x+12,G-113,12,0,7);x.stroke()}});if(mode==='play'||mode==='respawn'){x.save();x.translate(hero.x+18,hero.y+18);x.rotate(hero.r);x.fillStyle='#b4e61f';x.strokeStyle='#00eaff';x.lineWidth=4;x.fillRect(-18,-18,36,36);x.strokeRect(-18,-18,36,36);x.fillStyle='#11152f';x.fillRect(-10,-8,7,8);x.fillRect(3,-8,7,8);x.fillRect(-8,5,17,4);x.restore()}bits.forEach(p=>{x.globalAlpha=p.l*2;x.fillStyle='#ffe43b';x.fillRect(p.x,p.y,6,6);x.globalAlpha=1});x.restore();if(flash){x.fillStyle=`rgba(255,255,255,${flash})`;x.fillRect(0,0,W,H)}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}play.onclick=()=>{$('#select').classList.add('show');$('#home').style.display='none'};back.onclick=()=>{$('#select').classList.remove('show');$('#home').style.display='block'};restart.onclick=()=>start(level);pa.onclick=()=>mode=mode==='play'?'pause':mode==='pause'?'play':mode;addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(mode==='play'&&hero.ground)hero.vy=-870}});c.addEventListener('pointerdown',()=>{if(mode==='play'&&hero.ground)hero.vy=-870});reset();requestAnimationFrame(loop)</script></main></body></html>
