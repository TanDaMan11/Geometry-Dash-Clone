<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#06123f;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}main{position:relative;width:min(1100px,100vw);height:min(620px,100vh);overflow:hidden;background:radial-gradient(circle,#123f9b,#091b58 50%,#17082f);border:3px solid #00eaff;box-shadow:0 0 35px #00eaff88}.bg{position:absolute;inset:0;opacity:.2;background:linear-gradient(45deg,transparent 48%,#8bdcff 49%,transparent 51%),linear-gradient(-45deg,transparent 48%,#8bdcff 49%,transparent 51%);background-size:80px 80px;animation:scroll 7s linear infinite}@keyframes scroll{to{background-position:80px 80px}}button{cursor:pointer;font-weight:bold}.logo{text-align:center;margin:25px 0 8px;font-size:clamp(32px,7vw,78px);letter-spacing:-5px;color:#ffe83b;-webkit-text-stroke:5px #101018;text-shadow:0 8px #df7800,5px 12px #000}.home,.select{position:relative;z-index:1;text-align:center}.row{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:25px}.big{border:5px solid #111b32;box-shadow:inset 0 0 0 4px #c5ecff,0 7px #030714,0 0 22px #00dfff99}.garage{width:105px;height:105px;background:#ffe234;border-radius:18px;font-size:55px}.play{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#c2ff70,#22c947 58%,#078221);font-size:0}.play:after{content:'';display:inline-block;border-left:50px solid #ffe83b;border-top:31px solid transparent;border-bottom:31px solid transparent;margin-left:12px;filter:drop-shadow(3px 4px #111)}.create{width:105px;height:105px;border-radius:50%;background:#268ce8;font-size:50px}.tools{display:flex;justify-content:center;gap:16px;margin-top:52px}.tools button{width:64px;height:64px;border-radius:12px;background:#238de6;color:#ffe83b;font-size:32px;border:4px solid #111a2f;box-shadow:inset 0 0 0 3px #9ceaff,0 5px #050817}.chest{position:absolute;right:24px;top:245px;width:72px;height:72px;border-radius:15px;background:#b86d20;border:5px solid #ffd83d;font-size:35px}.select{display:none;position:absolute;inset:0;background:#07184fee;padding:25px}.select.show{display:block}.select h2{font-size:40px;color:#ffe83b;text-shadow:3px 4px #000;margin:10px}.carousel{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:15px}.arrow{font-size:48px;color:#ffe83b;background:none;border:0;text-shadow:3px 3px #000}.viewport{width:min(520px,70vw);overflow:hidden}.track{display:flex;transition:transform .28s ease}.card{flex:0 0 100%;padding:22px;background:linear-gradient(#2769d5,#123b9c);border:4px solid #ffe83b;border-radius:18px;box-shadow:0 8px #071333}.face{margin:auto;width:82px;height:82px;border-radius:20px;background:#42b9ff;border:5px solid #13214a;color:#10152d;font-size:40px;padding-top:13px}.card h3{font-size:27px;margin:8px;color:#ffe83b;text-shadow:2px 2px #111}.meter{height:12px;background:#071638;border:2px solid #9feeff;border-radius:8px;margin:8px}.meter i{display:block;width:42%;height:100%;background:#43f17a}.launch,.back{border:0;border-radius:28px;padding:13px 28px;margin:15px;background:linear-gradient(#6aff99,#12b852);box-shadow:0 5px #08722f}.game{display:none;position:absolute;inset:0;background:#071f5b;z-index:3}.game.show{display:block}canvas{width:100%;height:100%;display:block}.hud{position:absolute;z-index:4;top:15px;left:25px;right:25px;display:flex;justify-content:space-between;text-shadow:0 3px #000;font-weight:bold}.pause{background:#13265dcc;color:white;border:0;font-size:20px}.backgame{position:absolute;left:20px;bottom:15px;z-index:5}</style></head><body><main><div class=bg></div><section id=home class=home><div class=logo>GEOMETRY DASH</div><div class=row><button class="big garage">◆</button><button class="big play" id=play></button><button class="big create">⚒</button></div><button class=chest>♜</button><div class=tools><button>♜</button><button>◆</button><button>⚙</button><button>ⓘ</button></div></section><section id=select class=select><h2>SELECT LEVEL</h2><div class=carousel><button class=arrow id=prev>‹</button><div class=viewport><div id=track class=track></div></div><button class=arrow id=next>›</button></div><button class=back id=back>BACK</button></section><section id=game class=game><canvas id=c width=960 height=540></canvas><div class=hud><span id=title>STEREO MADNESS</span><span>ATTEMPT <b id=attempt>1</b> · <b id=pct>0</b>% <button class=pause id=pause>Ⅱ</button></span></div><button class="back launch backgame" id=quit>LEVELS</button></section><script>const names=['STEREO MADNESS','BACK ON TRACK','POLARGEIST','DRY OUT','BASE AFTER BASE'],track=document.querySelector('#track');let selected=0,playing=0;track.innerHTML=names.map((n,i)=>`<article class=card><div class=face>☻</div><h3>${n}</h3><div>★ ${i+1} · EASY</div><div class=meter><i></i></div><div>NORMAL MODE</div><div class=meter><i style="width:0%"></i></div><div>PRACTICE MODE · ◯ ◯ ◯</div><button class=launch data-i=${i}>PLAY</button></article>`).join('');function slide(){track.style.transform=`translateX(-${selected*100}%)`}prev.onclick=()=>{selected=(selected+names.length-1)%names.length;slide()};next.onclick=()=>{selected=(selected+1)%names.length;slide()};play.onclick=()=>{home.style.display='none';select.classList.add('show');slide()};back.onclick=()=>{select.classList.remove('show');home.style.display='block'};document.querySelectorAll('.launch').forEach(b=>b.onclick=()=>start(+b.dataset.i));function start(i){playing=i;selected=i;select.classList.remove('show');home.style.display='none';game.classList.add('show');title.textContent=names[i];attempt.textContent=1;reset()}quit.onclick=()=>{game.classList.remove('show');home.style.display='block'};let x=c.getContext('2d'),hero,obs,cam=0,last=0,dead=0;function reset(){hero={x:100,y:390,vy:0,on:1,r:0};obs=[];for(let z=500;z<6000;z+=170){obs.push({x:z,h:36});if(z%510<250)obs.push({x:z+45,h:36});if(z%680<300)obs.push({x:z+80,h:90})}requestAnimationFrame(loop)}function hit(a,b){return a.x<b.x+35&&a.x+35>b.x&&a.y<b.y+b.h&&a.y+35>b.y}function jump(){if(dead)return;if(hero.on){hero.vy=-850;hero.on=0}}addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});c.addEventListener('pointerdown',jump);function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(game.classList.contains('show')&&!dead){hero.vy+=2400*dt;hero.y+=hero.vy*dt;if(hero.y>=396){hero.y=396;hero.vy=0;hero.on=1;hero.r=Math.round(hero.r/(Math.PI/2))*Math.PI/2}hero.x+=280*dt;cam=Math.max(0,hero.x-170);for(const o of obs)if(hit({x:hero.x+5,y:hero.y+5},{x:o.x,y:396-o.h,h:o.h}))dead=1;pct.textContent=Math.min(100,hero.x/6000*100)|0}draw();requestAnimationFrame(loop)}function draw(){let q=x.createLinearGradient(0,0,0,540);q.addColorStop(0,['#092d85','#35115d','#57300c','#241044','#451335'][playing]);q.addColorStop(1,'#06102e');x.fillStyle=q;x.fillRect(0,0,960,540);x.save();x.translate(-cam,0);x.fillStyle='#001848';x.fillRect(0,432,6500,108);x.fillStyle='#00ffff';x.fillRect(0,432,6500,6);for(let i=0;i<90;i++){x.fillStyle=i%2?'#fff3':'#0005';x.fillRect(i*70,450,35,5)}obs.forEach(o=>{x.fillStyle='#151827';x.strokeStyle='#00dfff';x.lineWidth=3;x.beginPath();x.moveTo(o.x,432);x.lineTo(o.x+18,432-o.h);x.lineTo(o.x+36,432);x.closePath();x.fill();x.stroke()});x.save();x.translate(hero.x+17,hero.y+17);x.rotate(hero.r);x.fillStyle='#b4e61f';x.strokeStyle='#00eaff';x.lineWidth=4;x.fillRect(-17,-17,34,34);x.strokeRect(-17,-17,34,34);x.fillStyle='#11152f';x.fillRect(-10,-8,6,7);x.fillRect(4,-8,6,7);x.fillRect(-8,5,17,3);x.restore();x.restore()}reset()</script></main></body></html>
