<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash v1.5 levels 1-3 remix-2</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071653;color:#fff;font:700 18px Arial}body{display:grid;place-items:center}main{width:min(1100px,100vw);height:min(620px,100vh);background:linear-gradient(#164ba6,#12093d);border:3px solid #0df;box-shadow:0 0 35px #0df;position:relative;overflow:hidden;text-align:center}.home{padding:30px}.logo{font-size:clamp(34px,7vw,76px);font-weight:900;color:#ffe83b;text-shadow:0 8px #d70,4px 11px #111;-webkit-text-stroke:4px #111}.row{display:flex;justify-content:center;align-items:center;gap:28px;margin:38px}.btn{cursor:pointer;border:5px solid #111a33;box-shadow:inset 0 0 0 4px #cdf5ff,0 7px #050817,0 0 24px #0df}.kit{width:105px;height:105px;border-radius:18px;background:#f2c522;font-size:52px}.play{width:175px;height:175px;border-radius:50%;background:radial-gradient(#d4ff84,#20c94b 60%,#08782b);font-size:0}.play:after{content:'';display:inline-block;border-left:55px solid #ffe83b;border-top:35px solid transparent;border-bottom:35px solid transparent;margin-left:13px;filter:drop-shadow(3px 3px #111)}.create{width:105px;height:105px;border-radius:50%;background:#176ac8;color:#eaf7ff;font-size:46px}.screen{display:none;position:absolute;inset:0;background:#061748ed;padding:25px}.show{display:block}.card{width:min(470px,80vw);margin:35px auto;padding:25px;background:#245bb0;border:4px solid #ffe83b;border-radius:18px}.action{border:0;border-radius:24px;padding:13px 27px;background:#20c957;color:#fff;font-weight:bold;cursor:pointer}.back{position:absolute;bottom:16px;left:16px}.game{padding:0}.game canvas{width:100%;height:100%}.hud{position:absolute;top:14px;left:20px;right:20px;display:flex;justify-content:space-between;text-shadow:0 3px #000}</style><main><section id=home class=home><div class=logo>GEOMETRY DASH</div><div class=row><button class="btn kit">◆</button><button class="btn play" id=play></button><button class="btn create">⚒</button></div><div style="color:#ffe83b;font-size:34px">♜　◆　⚙　ⓘ</div></section><section id=levels class=screen><h1>SELECT LEVEL</h1><div class=card><h2>STEREO MADNESS</h2><p>Scratch project 142238675 · levels 1–3</p><p>Jump: ↑ W Space Ctrl CapsLock F1 F2 or click<br>Yellow rings · blue/yellow pads · avoid spikes</p><button class=action id=start>PLAY</button></div><button class="action back" id=back>HOME</button></section><section id=game class="screen game"><canvas id=c width=960 height=540></canvas><div class=hud><b>STEREO MADNESS</b><span>ATTEMPT <b id=attempt>1</b> · <b id=pct>0</b>%</span></div><button class="action back" id=quit>LEVELS</button></section></main><script>const ctx=c.getContext('2d');let p,items,dead=false,last=0;play.onclick=()=>{home.style.display='none';levels.classList.add('show')};back.onclick=()=>{levels.classList.remove('show');home.style.display='block'};quit.onclick=()=>{game.classList.remove('show');levels.classList.add('show')};start.onclick=()=>{levels.classList.remove('show');game.classList.add('show');reset()};function reset(){p={x:100,y:400,w:32,h:32,vy:0,on:true};items=[... [380,650,920,1190].map(x=>({x,y:396,w:38,h:36,type:'spike'})),{x:500,y:335,w:80,h:97,type:'block'},{x:730,y:285,w:80,h:147,type:'block'},{x:980,y:350,w:110,h:82,type:'block'},{x:1260,y:300,w:85,h:132,type:'block'},{x:600,y:300,w:28,h:12,type:'pad'},{x:870,y:300,w:24,h:24,type:'ring'}];dead=false}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function die(){if(dead)return;dead=true;setTimeout(()=>{reset();attempt.textContent=+attempt.textContent+1},350)}function jump(){if(!dead&&p.on){p.vy=-900;p.on=false}}addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW','ControlLeft','CapsLock','F1','F2'].includes(e.code)){e.preventDefault();jump()}});c.onpointerdown=jump;function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(game.classList.contains('show')&&!dead){let old=p.y+p.h;p.vy+=2400*dt;p.y+=p.vy*dt;p.on=false;if(p.y+p.h>=432){p.y=400;p.vy=0;p.on=true}for(const o of items){if(o.type==='pad'&&hit(p,o))p.vy=-1200;if(o.type==='ring'&&hit(p,o))p.vy=-1050;if(o.type==='spike'&&hit({x:p.x+6,y:p.y+6,w:20,h:22},o))die();if(o.type==='block'&&hit(p,o)){if(p.vy>=0&&old<=o.y+10){p.y=o.y-p.h;p.vy=0;p.on=true}else if(p.x+p.w>o.x&&p.x<o.x+14)die()}}p.x+=280*dt;pct.textContent=Math.min(100,p.x/1600*100)|0}draw();requestAnimationFrame(loop)}function draw(){ctx.fillStyle='#123d91';ctx.fillRect(0,0,960,540);ctx.save();ctx.translate(-Math.max(0,p.x-170),0);ctx.fillStyle='#001848';ctx.fillRect(0,432,2700,108);ctx.fillStyle='#0df';ctx.fillRect(0,432,2700,6);items.forEach(o=>{if(o.type==='block'){ctx.fillStyle='#405184';ctx.strokeStyle='#0df';ctx.fillRect(o.x,o.y,o.w,o.h);ctx.strokeRect(o.x,o.y,o.w,o.h)}else if(o.type==='spike'){ctx.fillStyle='#151827';ctx.beginPath();ctx.moveTo(o.x,432);ctx.lineTo(o.x+19,o.y);ctx.lineTo(o.x+38,432);ctx.fill()}else{ctx.fillStyle=o.type==='pad'?'#ffe43b':'#ffd83b';ctx.fillRect(o.x,o.y,o.w,o.h)}});ctx.fillStyle='#ffe43b';ctx.strokeStyle='#1de3df';ctx.lineWidth=4;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.restore()}reset();requestAnimationFrame(loop)</script></main>
