<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#001030;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}main{position:relative;width:min(1120px,100vw);height:min(630px,100vh);overflow:hidden;background:radial-gradient(circle at 50% 35%,#073c96,#06215e 45%,#16072e);border:3px solid #00eaff;box-shadow:0 0 40px #00eaff88}.grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(45deg,transparent 48%,#55bfff 49%,transparent 51%),linear-gradient(-45deg,transparent 48%,#55bfff 49%,transparent 51%);background-size:80px 80px;animation:g 8s linear infinite}@keyframes g{to{background-position:80px 80px}}.logo{text-align:center;margin:28px auto 8px;font-size:clamp(32px,7vw,78px);font-weight:1000;letter-spacing:-5px;color:#ffe83b;-webkit-text-stroke:5px #111;text-shadow:0 8px #e27b00,5px 12px #000,0 0 18px #ffd21f}.home,.levels{position:relative;z-index:1;text-align:center}.row{display:flex;justify-content:center;align-items:center;gap:30px;margin-top:30px}.icon{border:5px solid #121a2e;box-shadow:inset 0 0 0 4px #bde4ff,0 7px #050817,0 0 22px #00dfff88;cursor:pointer}.garage{width:105px;height:105px;background:#ffe234;border-radius:18px;font-size:55px}.play{width:170px;height:170px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#baff68,#22c947 58%,#078221);font-size:0}.play:after{content:'';display:inline-block;border-left:50px solid #ffe83b;border-top:31px solid transparent;border-bottom:31px solid transparent;margin-left:12px;filter:drop-shadow(3px 4px #111)}.create{width:105px;height:105px;border-radius:50%;background:#268ce8;font-size:50px}.bottom{display:flex;justify-content:center;gap:16px;margin-top:52px}.utility{width:65px;height:65px;border-radius:12px;background:#238de6;color:#ffe83b;font-size:33px;border:4px solid #111a2f;box-shadow:inset 0 0 0 3px #9ceaff,0 5px #050817;cursor:pointer}.chest{position:absolute;right:25px;top:245px;width:72px;height:72px;border-radius:15px;background:#b96f20;border:5px solid #ffd83d;font-size:36px;box-shadow:0 0 20px #ffd83d}.music{position:absolute;z-index:2;left:24px;top:22px;background:none;border:0;color:#ffe83b;font-size:30px}.levels{display:none;position:absolute;inset:0;background:#07184fee;padding:25px}.levels.show{display:block}.levels h2{font-size:42px;color:#ffe83b;text-shadow:3px 4px #000}.cards{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.level{width:170px;padding:14px;color:#fff;background:#164cbd;border:3px solid #ffe83b;border-radius:12px;font-weight:bold;cursor:pointer}.level small{display:block;color:#8cffae;margin-top:8px}.btn{border:0;border-radius:30px;padding:13px 29px;margin:28px 8px;background:linear-gradient(#69ff99,#12b852);box-shadow:0 5px #08752e;font-weight:bold;cursor:pointer}.hint{position:absolute;bottom:10px;width:100%;color:#bcecff;font-size:11px}</style></head><body><main><div class=grid></div><button class=music id=music>♫</button><section class=home id=home><div class=logo>GEOMETRY DASH</div><div class=row><button class="icon garage">◆</button><button class="icon play" id=play></button><button class="icon create">⚒</button></div><button class=chest>♜</button><div class=bottom><button class=utility>♜</button><button class=utility>◆</button><button class=utility>⚙</button><button class=utility>ⓘ</button></div><div class=hint>SELECT A LEVEL TO PLAY</div></section><section class=levels id=levels><h2>SELECT LEVEL</h2><div class=cards><button class=level data-level="STEREO MADNESS">◆<br>STEREO MADNESS<br>★ EASY<small>NORMAL ▰▱▱▱▱<br>PRACTICE ▱▱▱▱▱<br>◯ ◯ ◯</small></button><button class=level data-level="BACK ON TRACK">◆<br>BACK ON TRACK<br>★★ EASY<small>NORMAL ▰▱▱▱▱<br>PRACTICE ▱▱▱▱▱<br>◯ ◯ ◯</small></button><button class=level data-level=POLARGEIST>◆<br>POLARGEIST<br>★★★ NORMAL<small>NORMAL ▰▱▱▱▱<br>PRACTICE ▱▱▱▱▱<br>◯ ◯ ◯</small></button></div><button class=btn id=back>BACK</button></section><script>const home=document.querySelector('#home'),levels=document.querySelector('#levels');play.onclick=()=>{home.style.display='none';levels.classList.add('show')};back.onclick=()=>{levels.classList.remove('show');home.style.display='block'};music.onclick=()=>music.textContent=music.textContent==='♫'?'🔇':'♫';document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{b.textContent='LOADING '+b.dataset.level+'…';setTimeout(()=>b.textContent=b.dataset.level+' · READY',400)})</script></main></body></html>
