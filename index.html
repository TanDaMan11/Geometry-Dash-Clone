<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Dash: Stereo Pulse</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090d22;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{display:grid;place-items:center}.wrap{width:min(1100px,100vw);position:relative;padding:12px}canvas{display:block;width:100%;aspect-ratio:16/9;border:3px solid #42e8ff;border-radius:10px;background:#111a42;box-shadow:0 0 35px #18d8ff55, inset 0 0 40px #0008;image-rendering:auto}.hud{position:absolute;inset:22px 26px auto;display:flex;justify-content:space-between;align-items:start;pointer-events:none;text-shadow:0 2px 4px #000}.brand{font-weight:900;letter-spacing:2px;color:#62f5ff;font-size:clamp(12px,2vw,20px)}.sub{font-size:11px;color:#b9c8f5;letter-spacing:1px}.stats{text-align:right;font-weight:800}.bar{position:absolute;top:65px;left:10%;width:80%;height:8px;background:#ffffff22;border-radius:5px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#65ffca,#fff36d);box-shadow:0 0 12px #fff36d;transition:width .08s}.overlay{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}.card{background:#0a1032dd;border:1px solid #6bfbff88;border-radius:16px;padding:26px 38px;box-shadow:0 0 30px #14dbff33;pointer-events:auto}.card h1{margin:0 0 6px;font-size:clamp(22px,5vw,48px);color:#fff36d;text-shadow:0 0 18px #ffb300}.card p{color:#c8d7ff;margin:8px 0 18px}.btn{border:0;border-radius:8px;padding:12px 25px;background:#5bffcc;color:#06152b;font-weight:900;cursor:pointer;font-size:15px}.btn:hover{filter:brightness(1.18);transform:translateY(-1px)}.hidden{display:none}.hint{position:absolute;bottom:20px;width:100%;text-align:center;color:#b9c8f5;font-size:12px;opacity:.75;pointer-events:none}
</style>
</head><body><main class="wrap"><canvas id="game" width="960" height="540"></canvas><div class="hud"><div><div class="brand">STEREO PULSE</div><div class="sub">LEVEL 1 · SYNTHETIC HORIZON</div></div><div class="stats">ATTEMPT <span id="attempt">1</span><br><span id="percent">0</span>%</div></div><div class="bar"><div class="fill" id="fill"></div></div><div class="overlay" id="overlay"><div class="card"><h1 id="title">STEREO PULSE</h1><p id="message">Jump to the beat. Survive the neon.</p><button class="btn" id="start">PLAY LEVEL</button></div></div><div class="hint">SPACE / CLICK / TAP TO JUMP · R TO RESTART · SOUND ON</div></main>
<script>
'use strict';const c=document.getElementById('game'),x=c.getContext('2d'),W=960,H=540;let state='menu',attempt=1,t=0,last=0,cam=0,player,parts=[],audio,beatTimer;
const ground=430, finish=7200, gravity=2500, jump=-850;
const spikes=[320,540,760,980,1190,1420,1630,1870,2100,2340,2580,2830,3090,3340,3600,3870,4110,4380,4660,4940,5230,5500,5790,6100,6420,6720];
const blocks=[{x:690,w:110,h:70},{x:1110,w:150,h:80},{x:1760,w:110,h:115},{x:2700,w:180,h:70},{x:3480,w:140,h:100},{x:4560,w:180,h:75},{x:5860,w:150,h:110},{x:6500,w:190,h:70}];
const pads=[{x:1280,y:ground-10},{x:3210,y:ground-10},{x:5350,y:ground-10}];
function reset(){player={x:100,y:ground-36,vy:0,size:36,rot:0,onGround:false};cam=0;t=0;parts=[]}
function setupAudio(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.type='sawtooth';o.frequency.value=110;g.gain.value=.018;o.connect(g).connect(audio.destination);o.start();beatTimer=setInterval(()=>synth(0),300)}
function synth(freq){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=freq||[220,277,330,440][Math.floor(t*3)%4];g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.16);o.connect(g).connect(audio.destination);o.start();o.stop(audio.currentTime+.17)}
function jumpNow(){if(state==='menu'||state==='dead'||state==='win'){start();return}if(player.onGround){player.vy=jump;player.onGround=false;synth(520);burst(player.x,player.y+player.size,'#fff36d',8)}}
function start(){setupAudio();if(audio.state==='suspended')audio.resume();attempt=state==='menu'?1:attempt+1;document.getElementById('attempt').textContent=attempt;reset();state='play';document.getElementById('overlay').classList.add('hidden')}
function burst(px,py,col,n){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*500,vy:(Math.random()-.8)*500,life:.5,c:col})}
function die(){if(state!=='play')return;state='dead';burst(player.x+18,player.y+18,'#ff4b9b',32);synth(90);document.getElementById('title').textContent='CRASHED';document.getElementById('message').textContent='The beat waits for no one. Try again?';document.getElementById('start').textContent='RETRY';document.getElementById('overlay').classList.remove('hidden')}
function win(){state='win';document.getElementById('title').textContent='LEVEL COMPLETE!';document.getElementById('message').textContent='Perfect run. You conquered Synthetic Horizon.';document.getElementById('start').textContent='PLAY AGAIN';document.getElementById('overlay').classList.remove('hidden');burst(player.x,player.y,'#65ffca',80)}
function rectHit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(dt){if(state!=='play'){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=800*dt;p.life-=dt});parts=parts.filter(p=>p.life>0);return}t+=dt;player.vy+=gravity*dt;player.y+=player.vy*dt;player.onGround=false;
 let floor={x:player.x,y:ground-36,w:36,h:36};if(player.y>=ground-36){player.y=ground-36;player.vy=0;player.onGround=true}blocks.forEach(b=>{let r={x:b.x,y:ground-b.h,w:b.w,h:b.h};if(rectHit({x:player.x,y:player.y,w:36,h:36},r)&&player.vy>=0&&player.y+36-player.vy*dt<=r.y){player.y=r.y-36;player.vy=0;player.onGround=true}else if(rectHit({x:player.x+5,y:player.y+5,w:26,h:26},r))die()});spikes.forEach(s=>{let r={x:s+5,y:ground-30,w:30,h:30};if(rectHit({x:player.x+5,y:player.y+5,w:26,h:26},r))die()});pads.forEach(p=>{if(player.onGround&&Math.abs(player.x-p.x)<42){player.vy=-1050;player.onGround=false;synth(740);burst(player.x,ground,'#65ffca',10)}});player.x+=280*dt;player.rot=player.onGround?Math.round(player.rot/(Math.PI/2))*Math.PI/2:player.rot+dt*8;cam=Math.max(0,player.x-180);if(player.x>finish)win();document.getElementById('percent').textContent=Math.min(100,Math.floor(player.x/finish*100));document.getElementById('fill').style.width=Math.min(100,player.x/finish*100)+'%';if(Math.random()<dt*8)parts.push({x:player.x+36,y:ground-6,vx:-40,vy:-20,life:.35,c:'#65f5ff'})}
function draw(){let grad=x.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#101b50');grad.addColorStop(1,'#21134b');x.fillStyle=grad;x.fillRect(0,0,W,H);x.save();x.translate(-cam,0);for(let i=-1;i<finish/240+2;i++){x.fillStyle=i%2?'#ffffff08':'#65f5ff08';x.fillRect(i*240,80,2,350)}x.fillStyle='#101631';x.fillRect(0,ground,finish+500,H-ground);x.fillStyle='#65f5ff';x.fillRect(0,ground,finish+500,5);for(let i=0;i<finish/80;i++){x.fillStyle=i%2?'#ff4b9b':'#fff36d';x.globalAlpha=.25;x.fillRect(i*80,ground+18,38,3)}x.globalAlpha=1;blocks.forEach(b=>{x.fillStyle='#5134c9';x.fillRect(b.x,ground-b.h,b.w,b.h);x.strokeStyle='#65f5ff';x.lineWidth=3;x.strokeRect(b.x,ground-b.h,b.w,b.h);for(let q=0;q<b.w;q+=22){x.fillStyle='#ffffff18';x.fillRect(b.x+q,ground-b.h+8,10,b.h-16)}});spikes.forEach(s=>{x.fillStyle='#ff4b9b';x.beginPath();x.moveTo(s,ground);x.lineTo(s+20,ground-36);x.lineTo(s+40,ground);x.closePath();x.fill();x.strokeStyle='#fff36d';x.stroke()});pads.forEach(p=>{x.fillStyle='#65ffca';x.fillRect(p.x-25,ground-7,50,7);x.strokeStyle='#fff';x.strokeRect(p.x-25,ground-7,50,7)});if(state==='play'||state==='dead'){x.save();x.translate(player.x+18,player.y+18);x.rotate(player.rot);x.fillStyle='#fff36d';x.shadowColor='#ffbb22';x.shadowBlur=18;x.fillRect(-18,-18,36,36);x.shadowBlur=0;x.fillStyle='#111a42';x.fillRect(-9,-8,7,8);x.fillRect(3,-8,7,8);x.restore()}parts.forEach(p=>{x.globalAlpha=Math.max(0,p.life*2);x.fillStyle=p.c;x.fillRect(p.x,p.y,5,5);x.globalAlpha=1});x.fillStyle='#fff36d';x.font='bold 18px system-ui';x.fillText('FINISH',finish-35,ground-55);x.restore()}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById('start').onclick=()=>start();addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jumpNow()}if(e.key.toLowerCase()==='r')start()});c.addEventListener('pointerdown',jumpNow);reset();requestAnimationFrame(loop);
</script></body></html>
