<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Dash Clone</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080b26;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.wrap{width:min(1120px,100vw);padding:10px;position:relative}canvas{width:100%;aspect-ratio:16/9;display:block;border:3px solid #35e9ff;border-radius:12px;box-shadow:0 0 40px #00d9ff66}.hud{position:absolute;top:24px;left:28px;right:28px;display:flex;justify-content:space-between;z-index:2;text-shadow:0 3px #000;pointer-events:none}.logo{font:bold clamp(18px,3vw,34px) Arial;color:#ffe53b;-webkit-text-stroke:2px #7d3900;text-shadow:3px 4px #23142b}.small{font-size:11px;letter-spacing:2px;color:#bff8ff}.stats{text-align:right;font-weight:bold}.bar{position:absolute;z-index:3;top:73px;left:12%;width:76%;height:9px;border:2px solid #07152d;border-radius:9px;background:#ffffff44}.fill{display:block;height:100%;width:0;background:linear-gradient(90deg,#35f77d,#fff03b)}.overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#10144bbb}.hide{display:none!important}.card{width:min(650px,90%);padding:24px;text-align:center;background:#131a4eee;border:3px solid #55efff;border-radius:20px;box-shadow:0 0 30px #00ddff66}.card h1{font-size:clamp(28px,6vw,60px);margin:5px;color:#ffe53b;-webkit-text-stroke:2px #773700;text-shadow:3px 4px #181229}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.level{background:#ffffff12;color:#fff;border:2px solid #ffffff55;border-radius:9px;padding:8px 2px;font-size:11px;font-weight:bold}.level.sel{border-color:#fff03b;box-shadow:0 0 14px #fff03b}.level b{display:block;font-size:22px}.stars{color:#ffe53b}.btn{border:0;border-radius:30px;padding:13px 28px;background:linear-gradient(#6aff98,#13b951);box-shadow:0 5px #08732e;color:#031e10;font-weight:bold;cursor:pointer}.hint{position:absolute;bottom:18px;left:0;width:100%;text-align:center;font-size:11px;color:#c6dcff;z-index:2}.pause{position:absolute;right:25px;top:25px;z-index:3;background:#111b49cc;color:#fff;border:0;font-size:18px;border-radius:6px}</style></head><body><main class="wrap"><canvas id="c" width="960" height="540"></canvas><div class="hud"><div><div class="logo">GEOMETRY DASH</div><div class="small" id="name">STEREO MADNESS · EASY</div></div><div class="stats">ATTEMPT <span id="att">1</span><br><span id="pct">0</span>%</div></div><div class="bar"><i class="fill" id="fill"></i></div><button class="pause hide" id="pause">Ⅱ</button><div class="overlay" id="menu"><div class="card"><h1>GEOMETRY DASH</h1><p>Jump and fly your way through danger!</p><div class="levels" id="levels"></div><button class="btn" id="play">PLAY</button><p>SPACE / UP / CLICK / TAP · R RESTART</p></div></div><div class="overlay hide" id="end"><div class="card"><h1 id="title">CRASHED!</h1><p id="msg"></p><button class="btn" id="retry">RETRY</button> <button class="btn" id="back">LEVELS</button></div></div><div class="hint">SYNTHESIZED RHYTHM · MOBILE TOUCH READY</div></main><script>'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),W=960,H=540,G=432,FIN=5600;let state='menu',sel=0,attempt=1,cam=0,last=0,shake=0,flash=0,audio,step=0,hero,obs=[],dust=[];const levels=[['Stereo Madness','EASY',1,'#123d91','#20dcff',128],['Back On Track','EASY',2,'#41145d','#ef3bff',150],['Polargeist','NORMAL',3,'#104b5b','#29f2d1',160],['Dry Out','NORMAL',4,'#77300e','#ffc437',136],['Base After Base','HARD',5,'#143e28','#69f542',174]];function ui(){levelsEl.innerHTML=levels.map((v,i)=>`<button class="level ${i?'':'sel'}" data-i="${i}"><b>◆</b>${v[0]}<br><span class=stars>${'★'.repeat(v[2])}</span><br>${v[1]}</button>`).join('');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;document.querySelectorAll('.level').forEach(z=>z.classList.remove('sel'));b.classList.add('sel')})}const levelsEl=document.querySelector('#levels');ui();function tone(f,d=.14,t='square',v=.05){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(v,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}function music(){let n=[220,277,330,370,440,330,277,185];tone(n[step++%8],.18,'sawtooth',.025);tone(n[(step>>1)%8]/2,.22,'triangle',.04)}function reset(){hero={x:120,y:G-38,w:36,h:36,vy:0,r:0,ground:true};cam=0;obs=[];dust=[];let gap=sel===0?145:180;for(let z=600;z<FIN;z+=gap){obs.push({t:'spike',x:z,w:38,h:36});if(z>900&&z%700<180)obs.push({t:'spike',x:z+43,w:38,h:36});if(z>1250&&z%1050<220)obs.push({t:'block',x:z+75,w:72,h:55+(z%90)});if(z%800<160)obs.push({t:'orb',x:z+110,w:24,h:24})}}function collide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function start(){if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();audio.resume();attempt++;att.textContent=attempt;reset();state='play';menu.classList.add('hide');end.classList.add('hide');pause.classList.remove('hide');name.textContent=levels[sel][0].toUpperCase()+' · '+levels[sel][1];let countdown=3;name.textContent='GET READY · '+countdown;let id=setInterval(()=>{countdown--;name.textContent=countdown?'GET READY · '+countdown:levels[sel][0].toUpperCase()+' · '+levels[sel][1];if(!countdown){clearInterval(id);music()}},350)}function burst(a,b,col,n=25){for(let i=0;i<n;i++)dust.push({x:a,y:b,vx:(Math.random()-.5)*500,vy:(Math.random()-.7)*500,l:.6,col})}function die(){if(state!=='play')return;state='dead';shake=15;flash=.35;burst(hero.x+18,hero.y+18,levels[sel][4],45);tone(70,.45,'sawtooth',.08);title.textContent='CRASHED!';msg.textContent='Attempt '+attempt+' · '+levels[sel][0];end.classList.remove('hide');pause.classList.add('hide')}function win(){state='win';title.textContent='LEVEL COMPLETE!';msg.textContent=levels[sel][0]+' · '+levels[sel][2]+' stars';end.classList.remove('hide');pause.classList.add('hide');burst(hero.x,hero.y,'#ffe53b',70)}function jump(){if(state==='menu'||state==='dead'||state==='win'){start();return}if(state==='play'&&hero.ground){hero.vy=-870;hero.ground=false;tone(560);burst(hero.x+18,hero.y+36,'#ffe53b',8)}}function update(dt){dust.forEach(z=>{z.x+=z.vx*dt;z.y+=z.vy*dt;z.vy+=800*dt;z.l-=dt});dust=dust.filter(z=>z.l>0);flash=Math.max(0,flash-dt);if(state!=='play')return;hero.vy+=2450*dt;hero.y+=hero.vy*dt;hero.ground=false;if(hero.y>=G-hero.h){hero.y=G-hero.h;hero.vy=0;hero.ground=true;hero.r=Math.round(hero.r/(Math.PI/2))*Math.PI/2}for(const o of obs){let r=o.t==='spike'?{x:o.x+5,y:G-o.h+8,w:28,h:28}:o.t==='block'?{x:o.x,y:G-o.h,w:o.w,h:o.h}:{x:o.x,y:G-120,w:24,h:24};if(o.t==='orb'&&collide(hero,r)){hero.vy=-1040;tone(700)}else if(o.t!=='orb'&&collide({x:hero.x+5,y:hero.y+5,w:26,h:26},r))return die()}hero.x+=270*dt;hero.r=hero.ground?hero.r:hero.r+dt*8;cam=Math.max(0,hero.x-180);let pc=Math.min(100,hero.x/FIN*100);pct.textContent=pc|0;fill.style.width=pc+'%';if(hero.x>FIN)win();if(Math.random()<dt*8)dust.push({x:hero.x+36,y:G-3,vx:-60,vy:-20,l:.3,col:'#fff'})}function draw(){let L=levels[sel],q=x.createLinearGradient(0,0,0,H);q.addColorStop(0,L[3]);q.addColorStop(1,'#090b25');x.fillStyle=q;x.fillRect(0,0,W,H);x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}x.translate(-cam,0);for(let i=-2;i<FIN/100+5;i++){x.fillStyle=i%2?'#fff2':'#00ffff10';x.fillRect(i*100,90+(i%5)*35,3,3)}x.fillStyle='#101634';x.fillRect(0,G,FIN+500,H-G);x.fillStyle=L[4];x.fillRect(0,G,FIN+500,6);for(let i=0;i<FIN/70;i++){x.fillStyle=i%2?'#fff3':'#0005';x.fillRect(i*70,G+16,34,5)}obs.forEach(o=>{if(o.t==='spike'){x.fillStyle='#ef3eaa';x.strokeStyle='#ffe53b';x.lineWidth=3;x.beginPath();x.moveTo(o.x,G);x.lineTo(o.x+19,G-o.h);x.lineTo(o.x+38,G);x.closePath();x.fill();x.stroke();x.fillStyle='#fff8';x.beginPath();x.moveTo(o.x+19,G-28);x.lineTo(o.x+25,G-9);x.lineTo(o.x+13,G-9);x.fill()}else if(o.t==='block'){x.fillStyle='#5233c7';x.fillRect(o.x,G-o.h,o.w,o.h);x.strokeStyle=L[4];x.strokeRect(o.x,G-o.h,o.w,o.h);x.fillStyle='#fff2';for(let k=10;k<o.w;k+=22)x.fillRect(o.x+k,G-o.h+9,9,o.h-18)}else{x.fillStyle='#ffe53b';x.strokeStyle='#fff';x.beginPath();x.arc(o.x+12,G-108,12,0,7);x.fill();x.stroke()}});if(state==='play'||state==='dead'){x.save();x.translate(hero.x+18,hero.y+18);x.rotate(hero.r);x.fillStyle='#ffe53b';x.strokeStyle='#10152f';x.lineWidth=5;x.fillRect(-18,-18,36,36);x.strokeRect(-18,-18,36,36);x.fillStyle='#10152f';x.fillRect(-10,-8,7,8);x.fillRect(3,-8,7,8);x.fillRect(-8,5,17,4);x.restore()}dust.forEach(z=>{x.globalAlpha=Math.min(1,z.l*2);x.fillStyle=z.col;x.fillRect(z.x,z.y,6,6);x.globalAlpha=1});x.restore();if(flash){x.fillStyle='rgba(255,255,255,'+flash+')';x.fillRect(0,0,W,H)}}function loop(n){let dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}play.onclick=start;retry.onclick=start;back.onclick=()=>{end.classList.add('hide');menu.classList.remove('hide');state='menu'};pause.onclick=()=>{state=state==='play'?'pause':state==='pause'?'play':state};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.key.toLowerCase()==='r')start()});c.addEventListener('pointerdown',jump);reset();requestAnimationFrame(loop)</script></body></html>
