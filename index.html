<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#090b35;color:#fff;font-family:Arial Black,Arial,sans-serif}body{display:grid;place-items:center}main{position:relative;width:min(1100px,100vw);height:min(620px,100vh);overflow:hidden;background:radial-gradient(circle at 50% 35%,#164ba6,#10164f 48%,#19072b);border:3px solid #00eaff;box-shadow:0 0 40px #00eaff88}.bg{position:absolute;inset:0;opacity:.18;background-image:linear-gradient(45deg,transparent 48%,#9feeff 49%,transparent 51%),linear-gradient(-45deg,transparent 48%,#9feeff 49%,transparent 51%);background-size:80px 80px;animation:bg 8s linear infinite}@keyframes bg{to{background-position:80px 80px}}button{font:inherit;cursor:pointer}.logo{text-align:center;margin:24px auto 4px;font-size:clamp(31px,7vw,78px);letter-spacing:-5px;color:#ffe83b;-webkit-text-stroke:5px #111;text-shadow:0 8px #df7800,5px 12px #000}.home,.select,.game{position:relative;z-index:1;text-align:center}.row{display:flex;justify-content:center;align-items:center;gap:28px;margin-top:27px}.bevel{border:5px solid #111b32;box-shadow:inset 0 0 0 4px #d0efff,0 7px #050817,0 0 25px #00dfff99}.kit{width:108px;height:108px;border-radius:18px;background:linear-gradient(145deg,#fff36d,#eab900);font-size:53px;color:#a9ff34;text-shadow:3px 3px #10152d}.play{width:174px;height:174px;border-radius:50%;background:radial-gradient(circle at 32% 22%,#d2ff80,#2ad04d 58%,#087b27);font-size:0}.play:after{content:'';display:inline-block;border-left:53px solid #ffe83b;border-top:33px solid transparent;border-bottom:33px solid transparent;margin-left:12px;filter:drop-shadow(3px 4px #111)}.create{width:108px;height:108px;border-radius:50%;background:linear-gradient(145deg,#5dc8ff,#1671d0);font-size:48px;color:#ffe83b;text-shadow:3px 3px #111}.tools{display:flex;justify-content:center;gap:17px;margin-top:50px}.tools button{width:66px;height:66px;border-radius:13px;background:linear-gradient(#48b6ff,#1762b6);color:#ffe83b;font-size:32px;border:4px solid #111a2f;box-shadow:inset 0 0 0 3px #a5edff,0 5px #050817}.chest{position:absolute;right:24px;top:240px;width:74px;height:74px;border-radius:15px;background:linear-gradient(#e39b3a,#8f421d);border:5px solid #ffd83d;font-size:36px;box-shadow:0 0 25px #ffd83d}.select{display:none;position:absolute;inset:0;background:#07184fed;padding:24px}.select.show{display:block}.select h2{font-size:40px;color:#ffe83b;text-shadow:3px 4px #000}.carousel{display:flex;align-items:center;justify-content:center;gap:16px}.arrow{font-size:50px;color:#ffe83b;background:none;border:0}.viewport{width:min(520px,72vw);overflow:hidden}.track{display:flex;transition:transform .3s}.card{flex:0 0 100%;padding:18px;background:linear-gradient(#327cdb,#12368d);border:4px solid #ffe83b;border-radius:18px;box-shadow:0 8px #071333}.face{margin:auto;width:82px;height:82px;border-radius:18px;background:#ffe83b;border:5px solid #23d4e7;color:#12183b;font-size:43px;padding-top:13px}.card h3{margin:7px;color:#ffe83b;font-size:26px;text-shadow:2px 2px #111}.meter{height:12px;background:#071638;border:2px solid #9feeff;border-radius:8px;margin:6px}.meter i{display:block;height:100%;width:42%;background:#43f17a}.launch,.back{border:0;border-radius:30px;padding:13px 29px;margin:16px;background:linear-gradient(#6aff99,#12b852);box-shadow:0 5px #08722f}.game{display:none;position:absolute;inset:0;background:#081e58}.game.show{display:block}.game canvas{width:100%;height:100%}.hud{position:absolute;top:14px;left:25px;right:25px;display:flex;justify-content:space-between;text-shadow:0 3px #000}.backgame{position:absolute;bottom:16px;left:18px}</style></head><body><main><div class=bg></div><section id=home class=home><div class=logo>GEOMETRY DASH</div><div class=row><button class="bevel kit">◆</button><button class="bevel play" id=play></button><button class="bevel create">⚒</button></div><button class=chest>♜</button><div class=tools><button>♜</button><button>◆</button><button>⚙</button><button>ⓘ</button></div></section><section id=select class=select><h2>SELECT LEVEL</h2><div class=carousel><button class=arrow id=prev>‹</button><div class=viewport><div id=track class=track></div></div><button class=arrow id=next>›</button></div><button class=back id=back>BACK</button></section><section id=game class=game><canvas id=canvas width=960 height=540></canvas><div class=hud><b id=name>STEREO MADNESS</b><span>ATTEMPT <b id=attempt>1</b> · <b id=pct>0</b>% <button id=pause>Ⅱ</button></span></div><button class="back backgame" id=quit>LEVELS</button></section><script>const names=['STEREO MADNESS','BACK ON TRACK','POLARGEIST','DRY OUT','BASE AFTER BASE'];let index=0,playing=0;track.innerHTML=names.map((n,i)=>`<article class=card><div class=face>☻</div><h3>${n}</h3><div>★ ${i+1} · EASY</div><div class=meter><i></i></div><div>NORMAL MODE</div><div class=meter><i style="width:0%"></i></div><div>PRACTICE · ◯ ◯ ◯</div><button class=launch data-i=${i}>PLAY</button></article>`).join('');function slide(){track.style.transform=`translateX(-${index*100}%)`}prev.onclick=()=>{index=(index+4)%5;slide()};next.onclick=()=>{index=(index+1)%5;slide()};play.onclick=()=>{home.style.display='none';select.classList.add('show');slide()};back.onclick=()=>{select.classList.remove('show');home.style.display='block'};document.querySelectorAll('.launch').forEach(b=>b.onclick=()=>start(+b.dataset.i));quit.onclick=()=>{game.classList.remove('show');home.style.display='block'};let ctx=canvas.getContext('2d'),hero,obs=[],cam=0,last=0,paused=0;function start(i){playing=i;name.textContent=names[i];select.classList.remove('show');game.classList.add('show');reset()}function reset(){hero={x:100,y:395,vy:0,on:1,r:0};cam=0;obs=[];for(let z=480;z<6100;z+=170){obs.push({x:z,h:36,t:'spike'});if(z%510<300)obs.push({x:z+48,h:70,t:'block'});if(z%680<340)obs.push({x:z+95,h:12,t:'pad'});if(z%850<300)obs.push({x:z+125,h:24,t:'orb'})}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function jump(){if(!paused&&hero.on){hero.vy=-860;hero.on=0}}addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.key.toLowerCase()==='r')reset()});canvas.addEventListener('pointerdown',jump);pause.onclick=()=>paused=!paused;function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;if(game.classList.contains('show')&&!paused){hero.vy+=2400*dt;hero.y+=hero.vy*dt;if(hero.y>=395){hero.y=395;hero.vy=0;hero.on=1;hero.r=Math.round(hero.r/(Math.PI/2))*Math.PI/2}hero.x+=280*dt;cam=Math.max(0,hero.x-170);for(let o of obs){let r=o.t==='spike'?{x:o.x+7,y:396-o.h+8,w:24,h:28}:o.t==='block'?{x:o.x,y:396-o.h,w:38,h:o.h}:{x:o.x,y:396-o.h,w:o.t==='orb'?24:38,h:o.h};if(o.t==='pad'&&hit(hero,r))hero.vy=-1100;else if(o.t==='orb'&&hit(hero,r))hero.vy=-1050;else if(o.t!=='pad'&&o.t!=='orb'&&hit({x:hero.x+6,y:hero.y+6,w:24,h:24},r))reset()}pct.textContent=Math.min(100,hero.x/6100*100)|0}draw();requestAnimationFrame(loop)}function draw(){ctx.fillStyle=['#092d85','#35115d','#57300c','#241044','#451335'][playing];ctx.fillRect(0,0,960,540);ctx.save();ctx.translate(-cam,0);ctx.fillStyle='#001848';ctx.fillRect(0,432,7000,108);ctx.fillStyle='#00eaff';ctx.fillRect(0,432,7000,6);obs.forEach(o=>{if(o.t==='spike'){ctx.fillStyle='#171a29';ctx.strokeStyle='#00dfff';ctx.beginPath();ctx.moveTo(o.x,432);ctx.lineTo(o.x+18,396);ctx.lineTo(o.x+36,432);ctx.closePath();ctx.fill();ctx.stroke()}else if(o.t==='block'){ctx.fillStyle='#394473';ctx.fillRect(o.x,396-o.h,38,o.h);ctx.strokeStyle='#33dfff';ctx.strokeRect(o.x,396-o.h,38,o.h)}else if(o.t==='pad'){ctx.fillStyle='#ffe43b';ctx.fillRect(o.x,420,38,10)}else{ctx.strokeStyle='#ffe43b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(o.x+12,365,12,0,7);ctx.stroke()}});ctx.save();ctx.translate(hero.x+17,hero.y+17);ctx.rotate(hero.r);ctx.fillStyle='#ffe43b';ctx.strokeStyle='#1de3df';ctx.lineWidth=4;ctx.fillRect(-17,-17,34,34);ctx.strokeRect(-17,-17,34,34);ctx.fillStyle='#11152f';ctx.fillRect(-10,-8,6,7);ctx.fillRect(4,-8,6,7);ctx.fillRect(-8,5,17,3);ctx.restore();ctx.restore()}reset();requestAnimationFrame(loop)</script></main></body></html>
