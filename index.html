<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#071653;color:white;font:700 18px Arial}body{display:grid;place-items:center}main{width:min(1100px,100vw);height:min(620px,100vh);position:relative;overflow:hidden;background:radial-gradient(#164ba6,#110b3d);border:3px solid #0df;box-shadow:0 0 35px #0df8;text-align:center}.home{padding-top:25px}.logo{font:900 clamp(32px,7vw,78px) Arial;color:#ffe83b;-webkit-text-stroke:5px #111;text-shadow:0 8px #d70,5px 12px #000}.row{display:flex;justify-content:center;align-items:center;gap:28px;margin:28px}.asset{display:grid;place-items:center;border:5px solid #111b32;box-shadow:inset 0 0 0 4px #c9efff,0 7px #030817,0 0 24px #0dff;cursor:pointer}.garage{width:105px;height:105px;border-radius:18px;background:linear-gradient(#fff36d,#dca900);font-size:54px;color:#aaff35}.play{width:170px;height:170px;border-radius:50%;background:radial-gradient(#d4ff80,#20c949 60%,#087726);font-size:0}.play:after{content:'';border-left:52px solid #ffe83b;border-top:32px solid transparent;border-bottom:32px solid transparent;margin-left:12px;filter:drop-shadow(3px 3px #111)}.create{width:105px;height:105px;border-radius:50%;background:linear-gradient(145deg,#61cbff,#1268c8);font-size:48px;color:#ffe83b}.menu{margin-top:48px;font-size:34px;color:#ffe83b}.select,.game{display:none;position:absolute;inset:0;padding:25px;background:#07184fee}.show{display:block}.card{margin:35px auto;padding:25px;width:min(430px,70vw);background:linear-gradient(#347ddd,#123789);border:4px solid #ffe83b;border-radius:18px}.card h2{color:#ffe83b}.card button,.back{border:0;border-radius:25px;padding:12px 26px;background:#20c957;color:#fff;font-weight:bold;cursor:pointer}.game canvas{width:100%;height:100%}.hud{position:absolute;top:15px;left:20px;right:20px;display:flex;justify-content:space-between;text-shadow:0 3px #000}.back{position:absolute;bottom:15px;left:15px}</style><main><section id=home class=home><div class=logo>GEOMETRY DASH</div><div class=row><button class="asset garage" id=garage>◆</button><button class="asset play" id=play></button><button class="asset create" id=create>⚒</button></div><div class=menu>♜　◆　⚙　ⓘ</div></section><section id=select class=select><h1>SELECT LEVEL</h1><div class=card><h2 id=levelName>STEREO MADNESS</h2><div>★ EASY　 NORMAL ▰▱▱▱▱</div><div>PRACTICE ▱▱▱▱▱　◯ ◯ ◯</div><button id=launch>PLAY</button></div><button class=back id=selectBack>HOME</button></section><section id=game class=game><canvas id=canvas width=960 height=540></canvas><div class=hud><span id=title>STEREO MADNESS</span><span>ATTEMPT <b id=attempt>1</b> · <b id=pct>0</b>%</span></div><button class=back id=quit>LEVELS</button></section><script>const $=id=>document.getElementById(id),ctx=canvas.getContext('2d');let hero,blocks,spikes,t=0,last=0,dead=0;function menu(){home.style.display='block';select.classList.remove('show');game.classList.remove('show')}play.onclick=()=>{home.style.display='none';select.classList.add('show')};selectBack.onclick=menu;quit.onclick=()=>{game.classList.remove('show');select.classList.add('show')};launch.onclick=()=>{select.classList.remove('show');game.classList.add('show');reset()};function reset(){hero={x:100,y:390,w:32,h:32,vy:0,onGround:true};blocks=[{x:500,y:335,w:70,h:97},{x:700,y:285,w:75,h:147},{x:930,y:350,w:110,h:82},{x:1220,y:300,w:80,h:132}];spikes=[{x:380,y:396,w:38,h:36},{x:610,y:299,w:38,h:36},{x:840,y:396,w:38,h:36},{x:1090,y:396,w:38,h:36}];dead=0}function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function die(){if(dead)return;dead=1;setTimeout(()=>{reset();attempt.textContent=+attempt.textContent+1},350)}function jump(){if(!dead&&hero.onGround){hero.vy=-850;hero.onGround=false}}addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp')jump()});canvas.addEventListener('pointerdown',jump);function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(game.classList.contains('show')&&!dead){hero.vy+=2300*dt;let oldBottom=hero.y+hero.h;hero.y+=hero.vy*dt;hero.onGround=false;if(hero.y+hero.h>=432){hero.y=400;hero.vy=0;hero.onGround=true}for(const b of blocks){if(overlap(hero,b)){if(oldBottom<=b.y&&hero.vy>=0){hero.y=b.y-hero.h;hero.vy=0;hero.onGround=true}else if(hero.x+hero.w>b.x+8&&hero.x<b.x+12)die()}}for(const s of spikes)if(overlap({x:hero.x+6,y:hero.y+6,w:20,h:22},s))die();hero.x+=275*dt;pct.textContent=Math.min(100,hero.x/1500*100)|0}draw();requestAnimationFrame(loop)}function draw(){ctx.fillStyle='#123a8e';ctx.fillRect(0,0,960,540);ctx.fillStyle='#001848';ctx.fillRect(0,432,2000,108);ctx.fillStyle='#0df';ctx.fillRect(0,432,2000,6);ctx.save();ctx.translate(-Math.max(0,hero.x-170),0);blocks.forEach(b=>{ctx.fillStyle='#394473';ctx.strokeStyle='#32eaff';ctx.lineWidth=3;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.strokeRect(b.x,b.y,b.w,b.h)});spikes.forEach(s=>{ctx.fillStyle='#151827';ctx.strokeStyle='#0df';ctx.beginPath();ctx.moveTo(s.x,432);ctx.lineTo(s.x+19,s.y);ctx.lineTo(s.x+38,432);ctx.closePath();ctx.fill();ctx.stroke()});ctx.fillStyle='#ffe43b';ctx.strokeStyle='#19e5df';ctx.lineWidth=4;ctx.fillRect(hero.x,hero.y,hero.w,hero.h);ctx.strokeRect(hero.x,hero.y,hero.w,hero.h);ctx.restore()}reset();requestAnimationFrame(loop)</script></main>
