<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Dash Clone</title><style>
:root{--cyan:#16e8ff;--pink:#ff3eaa;--yellow:#ffe83b;--green:#38f67b;--ink:#11152f}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080b26;color:#fff;font-family:Arial,Helvetica,sans-serif}body{display:grid;place-items:center}.shell{width:min(1120px,100vw);padding:10px;position:relative}canvas{display:block;width:100%;aspect-ratio:16/9;border:3px solid #47eaff;border-radius:12px;box-shadow:0 0 40px #00dbff66;background:#162259}.top{position:absolute;z-index:2;left:28px;right:28px;top:24px;display:flex;justify-content:space-between;pointer-events:none;text-shadow:0 3px 3px #000}.logo{font-size:clamp(18px,3vw,34px);font-weight:1000;letter-spacing:-2px;color:#ffe43a;-webkit-text-stroke:2px #8e4100;text-shadow:3px 4px 0 #351d12,0 0 16px #ffbd24}.small{font-size:11px;letter-spacing:2px;color:#bdefff;font-weight:bold}.stats{text-align:right;font-weight:900;font-size:13px}.progress{position:absolute;z-index:3;top:73px;left:12%;width:76%;height:9px;border:2px solid #07152d;border-radius:8px;background:#ffffff44;overflow:hidden}.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38f67b,#fff23a);box-shadow:0 0 12px #fff}.screen{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:linear-gradient(#091145aa,#260b4faa)}.panel{width:min(640px,90%);padding:22px;text-align:center;background:#121847eF;border:3px solid #53edff;border-radius:20px;box-shadow:0 0 28px #00d9ff66, inset 0 0 25px #0008}.panel h1{margin:0 0 3px;font-size:clamp(28px,6vw,62px);color:#ffe33c;-webkit-text-stroke:2px #733800;text-shadow:3px 4px #1a1734}.panel p{margin:8px;color:#cde8ff}.hide{display:none!important}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:18px 0}.level{border:2px solid #ffffff66;border-radius:10px;padding:9px 3px;background:#ffffff12;color:#fff;cursor:pointer;font-weight:900;font-size:11px}.level.sel{border-color:#fff23b;box-shadow:0 0 14px #fff23b;background:#fff23b22}.level b{display:block;font-size:24px;margin-bottom:5px}.stars{color:#ffe43a;letter-spacing:-2px}.btn{border:0;border-radius:50px;padding:13px 28px;background:linear-gradient(#65ff96,#18bc56);color:#052516;font-size:16px;font-weight:1000;cursor:pointer;box-shadow:0 5px 0 #087231,0 0 18px #22ed7c88}.btn:hover{filter:brightness(1.2);transform:translateY(-1px)}.circle{width:78px;height:78px;border:5px solid #071b2a;border-radius:24px;background:#ffe43b;margin:0 auto 12px;box-shadow:inset 0 0 0 4px #fff07a,0 0 20px #ffe43b88;display:grid;place-items:center;font-size:38px;color:#10152f}.hint{position:absolute;bottom:18px;z-index:2;width:100%;left:0;text-align:center;font-size:11px;color:#c4d8ff;opacity:.8;pointer-events:none}.pause{position:absolute;right:25px;top:25px;z-index:4;border:0;border-radius:8px;background:#101a45cc;color:#fff;font-size:18px;cursor:pointer}.mode{font-size:12px;color:#9bfbff;margin-top:8px}
</style></head><body><main class="shell"><canvas id="game" width="960" height="540"></canvas><div class="top"><div><div class="logo">GEOMETRY DASH</div><div class="small" id="label">STEREO MADNESS · EASY</div></div><div class="stats">ATTEMPT <span id="attempt">1</span><br><span id="pct">0</span>%</div></div><div class="progress"><i id="fill"></i></div><button class="pause hide" id="pause">Ⅱ</button><div class="screen" id="menu"><section class="panel"><div class="circle">◆</div><h1>GEOMETRY DASH</h1><p>Jump and fly your way through danger!</p><div class="levels" id="levels"></div><button class="btn" id="play">PLAY</button><div class="mode">SPACE / UP / CLICK / TAP TO JUMP · R TO RESTART</div></section></div><div class="screen hide" id="end"><section class="panel"><div class="circle" id="endicon">✦</div><h1 id="endtitle">LEVEL COMPLETE!</h1><p id="endtext"></p><button class="btn" id="retry">RETRY</button> <button class="btn" id="levelsBtn">LEVELS</button></section></div><div class="hint">SOUND ON · SYNTHESIZED RHYTHM · MOBILE TOUCH READY</div></main><script>
'use strict';const C=document.querySelector('canvas'),g=C.getContext('2d'),W=960,H=540,G=432,finish=5600;let state='menu',sel=0,attempt=1,cam=0,last=0,beat=0,audio=null,p=[],shake=0;const levels=[['Stereo Madness','EASY',1,'#123c86','#20d8ff',128,132],['Back On Track','EASY',2,'#3d175c','#e936ff',150,150],['Polargeist','NORMAL',3,'#114b58','#27f3d0',160,160],['Dry Out','NORMAL',4,'#7a3012','#ffbd35',136,136],['Base After Base','HARD',5,'#183f27','#6bf53f',174,174]];let hero,obstacles;
function buildLevels(){document.querySelector('#levels').innerHTML=levels.map((v,i)=>`<button class="level ${i?'':'sel'}" data-i="${i}"><b>◆</b>${v[0]}<br><span class="stars">${'★'.repeat(v[2])}</span><br>${v[1]}</button>`).join('');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{sel=+b.dataset.i;document.querySelectorAll('.level').forEach(q=>q.classList.remove('sel'));b.classList.add('sel')})}buildLevels();
function audioInit(){if(audio)return;audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();}function tone(f,d=.12,type='square',vol=.045){if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.type=type;o.frequency.value=f;a.gain.setValueAtTime(vol,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}
function music(){let L=levels[sel],tempo=L[5],notes=[220,277,330,370,440,330,277,185];tone(notes[Math.floor(beat)%notes.length],.18,'sawtooth',.025);tone(notes[Math.floor(beat/2)%notes.length]/2,.22,'triangle',.045);beat+=1}function reset(){hero={x:110,y:G-38,vy:0,r:0,ground:true};cam=0;p=[];obstacles=[];let seed=levels[sel][2];for(let x=330;x<finish;x+=180+((x*seed)%100)){let spike=x;obstacles.push({type:'spike',x:spike,w:38,h:36});if((x/180|0)%4===0)obstacles.push({type:'block',x:x+65,w:70,h:55+((x*3)%70)});if((x/180|0)%7===0)obstacles.push({type:'orb',x:x+105,w:22,h:22})}}function start(){audioInit();attempt++;document.querySelector('#attempt').textContent=attempt;reset();state='play';document.querySelector('#menu').classList.add('hide');document.querySelector('#end').classList.add('hide');document.querySelector('#pause').classList.remove('hide');document.querySelector('#label').textContent=levels[sel][0].toUpperCase()+' · '+levels[sel][1];music()}function burst(x,y,col,n=18){for(let i=0;i<n;i++)p.push({x,y,vx:(Math.random()-.5)*500,vy:(Math.random()-.7)*500,l:.55,c:col})}function die(){state='dead';shake=12;burst(hero.x,hero.y,levels[sel][4],40);tone(75,.5,'sawtooth',.08);document.querySelector('#endtitle').textContent='CRASHED!';document.querySelector('#endtext').textContent='Attempt '+attempt+' · '+levels[sel][0];document.querySelector('#end').classList.remove('hide');document.querySelector('#pause').classList.add('hide')}function win(){state='win';burst(hero.x,hero.y,'#ffe43b',70);document.querySelector('#endtitle').textContent='LEVEL COMPLETE!';document.querySelector('#endtext').textContent=levels[sel][0]+' · '+levels[sel][2]+' stars collected';document.querySelector('#end').classList.remove('hide');document.querySelector('#pause').classList.add('hide')}function jump(){if(state==='menu'||state==='dead'||state==='win'){start();return}if(state==='play'&&hero.ground){hero.vy=-870;hero.ground=false;tone(560,.12,'square',.07);burst(hero.x+18,hero.y+38,'#ffe43b',8)}}
function hit(a,b){return a.x<b.x+b.w&&a.x+36>b.x&&a.y<b.y+b.h&&a.y+36>b.y}function update(dt){p.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=720*dt;q.l-=dt});p=p.filter(q=>q.l>0);if(state!=='play')return;hero.vy+=2450*dt;hero.y+=hero.vy*dt;hero.ground=false;if(hero.y>=G-38){hero.y=G-38;hero.vy=0;hero.ground=true}for(const o of obstacles){let r=o.type==='spike'?{x:o.x+5,y:G-o.h+8,w:28,h:28}:o.type==='block'?{x:o.x,y:G-o.h,w:o.w,h:o.h}:{x:o.x,y:G-120,w:22,h:22};if(o.type==='orb'&&hit(hero,r)){hero.vy=-1040;tone(700,.12,'square',.06)}else if(hit(hero,{x:hero.x+5,y:hero.y+5,w:26,h:26},r))die()}hero.x+=270*dt;hero.r=hero.ground?Math.round(hero.r/(Math.PI/2))*Math.PI/2:hero.r+dt*8;cam=Math.max(0,hero.x-180);document.querySelector('#pct').textContent=Math.min(100,hero.x/finish*100|0);document.querySelector('#fill').style.width=Math.min(100,hero.x/finish*100)+'%';if(hero.x>finish)win();if(Math.random()<dt*8)p.push({x:hero.x+36,y:G-3,vx:-60,vy:-20,l:.3,c:'#fff'})}
function draw(){let L=levels[sel],q=g.createLinearGradient(0,0,0,H);q.addColorStop(0,L[3]);q.addColorStop(1,'#090b25');g.fillStyle=q;g.fillRect(0,0,W,H);g.save();if(shake){g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}g.translate(-cam,0);for(let i=-2;i<finish/100+5;i++){g.fillStyle=i%2?'#fff2':'#00ffff09';g.beginPath();g.arc(i*100,100+(i%5)*35,2,0,7);g.fill()}g.fillStyle='#111631';g.fillRect(0,G,finish+500,H-G);g.fillStyle=L[4];g.fillRect(0,G,finish+500,6);for(let i=0;i<finish/70;i++){g.fillStyle=i%2?'#fff3':'#0005';g.fillRect(i*70,G+16,34,5)}obstacles.forEach(o=>{if(o.type==='spike'){g.fillStyle='#ef3eaa';g.strokeStyle='#ffe43b';g.lineWidth=3;g.beginPath();g.moveTo(o.x,G);g.lineTo(o.x+19,G-o.h);g.lineTo(o.x+38,G);g.closePath();g.fill();g.stroke();g.fillStyle='#fff8';g.beginPath();g.moveTo(o.x+19,G-27);g.lineTo(o.x+25,G-9);g.lineTo(o.x+13,G-9);g.fill()}else if(o.type==='block'){g.fillStyle='#5233c7';g.fillRect(o.x,G-o.h,o.w,o.h);g.strokeStyle=L[4];g.lineWidth=3;g.strokeRect(o.x,G-o.h,o.w,o.h);g.fillStyle='#fff2';for(let k=10;k<o.w;k+=22)g.fillRect(o.x+k,G-o.h+9,9,o.h-18)}else{g.fillStyle='#ffe43b';g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.arc(o.x+11,G-109,11,0,7);g.fill();g.stroke()}});if(state==='play'||state==='dead'){g.save();g.translate(hero.x+18,hero.y+18);g.rotate(hero.r);g.fillStyle='#ffe43b';g.strokeStyle='#10152f';g.lineWidth=5;g.fillRect(-18,-18,36,36);g.strokeRect(-18,-18,36,36);g.fillStyle='#10152f';g.fillRect(-10,-8,7,8);g.fillRect(3,-8,7,8);g.fillRect(-8,5,17,4);g.restore()}p.forEach(z=>{g.globalAlpha=Math.min(1,z.l*2);g.fillStyle=z.c;g.fillRect(z.x,z.y,6,6);g.globalAlpha=1});g.restore()}
function loop(n){let dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}document.querySelector('#play').onclick=start;document.querySelector('#retry').onclick=start;document.querySelector('#levelsBtn').onclick=()=>{document.querySelector('#end').classList.add('hide');document.querySelector('#menu').classList.remove('hide');state='menu'};document.querySelector('#pause').onclick=()=>{if(state==='play'){state='pause';document.querySelector('#pause').textContent='▶'}else if(state==='pause'){state='play';document.querySelector('#pause').textContent='Ⅱ'}};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.key.toLowerCase()==='r')start()});addEventListener('pointerdown',e=>{if(e.target===C)jump()});reset();requestAnimationFrame(loop);
</script></body></html>
