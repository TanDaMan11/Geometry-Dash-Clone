<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#001030;color:white;font-family:Arial,sans-serif}body{display:grid;place-items:center}main{width:min(1120px,100vw);padding:10px;position:relative}canvas{display:block;width:100%;aspect-ratio:16/9;border:3px solid #00ffff;box-shadow:0 0 35px #00ffff88}.hud{position:absolute;top:22px;left:28px;right:28px;z-index:2;display:flex;justify-content:space-between;text-shadow:0 3px #000;pointer-events:none}.logo{font-size:clamp(18px,3vw,34px);font-weight:1000;color:#ffe43b;-webkit-text-stroke:2px #713600;text-shadow:3px 4px #111}.bar{position:absolute;top:72px;left:12%;width:76%;height:9px;border:2px solid #001020;border-radius:8px;background:#ffffff44;z-index:3}.fill{display:block;height:100%;width:0;background:#42f47b}.panel{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#071442dd}.card{width:min(680px,92%);padding:22px;text-align:center;background:#121d50ee;border:3px solid #00eaff;border-radius:18px}.card h1{font-size:clamp(28px,6vw,60px);color:#ffe43b;margin:5px;-webkit-text-stroke:2px #713600}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:18px 0}.level{background:#ffffff14;color:#fff;border:2px solid #ffffff66;border-radius:8px;padding:8px 2px;font-weight:bold;font-size:11px}.level.sel{border-color:#ffe43b;box-shadow:0 0 15px #ffe43b}.level b{display:block;font-size:23px}.stars{color:#ffe43b}.btn{border:0;border-radius:40px;padding:14px 32px;background:linear-gradient(#69ff99,#12b852);box-shadow:0 5px #08722f;font-weight:bold;cursor:pointer}.pause{position:absolute;right:26px;top:24px;z-index:5;background:#111d4ddd;color:#fff;border:0;font-size:18px}.hide{display:none!important}</style></head><body><main><canvas id=c width=960 height=540></canvas><div class=hud><div><div class=logo>GEOMETRY DASH</div><small id=label>STEREO MADNESS · EASY</small></div><div>ATTEMPT <span id=att>0</span><br><span id=pct>0</span>%</div></div><div class=bar><i id=fill class=fill></i></div><button id=pause class="pause hide">Ⅱ</button><div id=panel class=panel><div class=card><h1>GEOMETRY DASH</h1><p>Select a level and jump to the beat.</p><div id=levels class=levels></div><button id=play class=btn>PLAY</button><p>SPACE / UP / CLICK / TAP TO JUMP · R RESTART</p></div></div></main><script>'use strict';const c=document.querySelector('#c'),x=c.getContext('2d'),G=432,END=5600;let s='menu',pick=0,attempt=0,last=0,cam=0,shake=0,flash=0,audio=null,hero,items=[],bits=[];const lev=[['Stereo Madness','EASY',1,'#001133','#00aaff',145],['Back On Track','EASY',2,'#250044','#e62cff',155],['Polargeist','NORMAL',3,'#003c52','#19e5d0',165],['Dry Out','NORMAL',4,'#5b2108','#ffb52e',145],['Base After Base','HARD',5,'#073d24','#55f542',175]];function build(){levels.innerHTML=lev.map((v,i)=>`<button class="level ${i?'':'sel'}" data-i=${i}><b>◆</b>${v[0]}<br><span class=stars>${'★'.repeat(v[2])}</span><br>${v[1]}</button>`).join('');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{pick=+b.dataset.i;document.querySelectorAll('.level').forEach(z=>z.classList.remove('sel'));b.classList.add('sel')})}build();function beep(f,d=.12,t='square',v=.05){try{if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(v,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function reset(){hero={x:120,y:G-36,w:36,h:36,vy:0,r:0,ground:true};cam=0;items=[];bits=[];let gap=pick?175:145;for(let z=650;z<END;z+=gap){items.push({t:'spike',x:z,w:38,h:36});if(!pick&&z>1000&&z%700<200)items.push({t:'spike',x:z+42,w:38,h:36});if(z>1300&&z%900<180)items.push({t:'block',x:z+65,w:75,h:55+z%75});if(z%800<150)items.push({t:'orb',x:z+112,w:24,h:24})}}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function start(){try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume()}catch(e){audio=null}attempt++;att.textContent=attempt;reset();s='play';panel.classList.add('hide');pause.classList.remove('hide');label.textContent='GET READY · 3';let n=3,id=setInterval(()=>{label.textContent=n?`GET READY · ${n}`:lev[pick][0].toUpperCase()+' · '+lev[pick][1];if(!n)clearInterval(id);n--},300)}function burst(a,b,col,n=35){while(n--)bits.push({x:a,y:b,vx:(Math.random()-.5)*500,vy:(Math.random()-.7)*500,l:.55,col})}function die(){if(s!=='play')return;s='respawn';shake=15;flash=.3;burst(hero.x+18,hero.y+18,lev[pick][4]);beep(70,.4,'sawtooth',.08);setTimeout(()=>{attempt++;att.textContent=attempt;reset();s='play';label.textContent=lev[pick][0].toUpperCase()+' · '+lev[pick][1]},500)}function jump(){if(s==='menu'){start();return}if(s==='play'&&hero.ground){hero.vy=-870;hero.ground=false;beep(560);burst(hero.x+18,hero.y+36,'#ffe43b',8)}}function update(dt){bits.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=800*dt;p.l-=dt});bits=bits.filter(p=>p.l>0);flash=Math.max(0,flash-dt);if(s!=='play')return;hero.vy+=2450*dt;hero.y+=hero.vy*dt;hero.ground=false;if(hero.y>=G-hero.h){hero.y=G-hero.h;hero.vy=0;hero.ground=true;hero.r=Math.round(hero.r/(Math.PI/2))*Math.PI/2}for(const o of items){let r=o.t==='spike'?{x:o.x+5,y:G-o.h+8,w:28,h:28}:o.t==='block'?{x:o.x,y:G-o.h,w:o.w,h:o.h}:{x:o.x,y:G-120,w:24,h:24};if(o.t==='orb'&&hit(hero,r)){hero.vy=-1040;beep(700)}else if(o.t!=='orb'&&hit({x:hero.x+5,y:hero.y+5,w:26,h:26},r))return die()}hero.x+=270*dt;hero.r=hero.ground?hero.r:hero.r+dt*8;cam=Math.max(0,hero.x-180);let z=Math.min(100,hero.x/END*100);pct.textContent=z|0;fill.style.width=z+'%';if(hero.x>END){s='menu';panel.classList.remove('hide');pause.classList.add('hide')}}function draw(){let L=lev[pick],q=x.createLinearGradient(0,0,0,540);q.addColorStop(0,L[3]);q.addColorStop(1,'#09102e');x.fillStyle=q;x.fillRect(0,0,960,540);x.save();if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}x.translate(-cam,0);for(let i=-2;i<70;i++){x.fillStyle=i%2?'#fff2':'#0066ff55';x.fillRect(i*100,90+i%5*35,3,3)}x.fillStyle='#001848';x.fillRect(0,G,END+600,108);x.fillStyle='#00ffff';x.fillRect(0,G,END+600,6);for(let i=0;i<90;i++){x.fillStyle=i%2?'#fff3':'#0005';x.fillRect(i*70,G+15,35,5)}items.forEach(o=>{if(o.t==='spike'){x.fillStyle='#171a29';x.strokeStyle='#00dfff';x.lineWidth=3;x.beginPath();x.moveTo(o.x,G);x.lineTo(o.x+19,G-o.h);x.lineTo(o.x+38,G);x.closePath();x.fill();x.stroke();x.strokeStyle='#73829d';x.beginPath();x.moveTo(o.x+19,G-27);x.lineTo(o.x+13,G-8);x.stroke()}else if(o.t==='block'){x.fillStyle='#353c66';x.fillRect(o.x,G-o.h,o.w,o.h);x.strokeStyle=L[4];x.lineWidth=4;x.strokeRect(o.x,G-o.h,o.w,o.h);x.strokeStyle='#a8b9de';x.lineWidth=2;x.strokeRect(o.x+8,G-o.h+8,o.w-16,o.h-16)}else{x.strokeStyle='#fff';x.fillStyle='#ffe43b';x.beginPath();x.arc(o.x+12,G-108,12,0,7);x.fill();x.stroke()}});if(s==='play'||s==='respawn'){x.save();x.translate(hero.x+18,hero.y+18);x.rotate(hero.r);x.fillStyle='#b4e61f';x.strokeStyle='#00eaff';x.lineWidth=4;x.fillRect(-18,-18,36,36);x.strokeRect(-18,-18,36,36);x.fillStyle='#10152f';x.fillRect(-10,-8,7,8);x.fillRect(3,-8,7,8);x.fillRect(-8,5,17,4);x.restore()}bits.forEach(p=>{x.globalAlpha=Math.min(1,p.l*2);x.fillStyle=p.col;x.fillRect(p.x,p.y,6,6);x.globalAlpha=1});x.restore();if(flash){x.fillStyle=`rgba(255,255,255,${flash})`;x.fillRect(0,0,960,540)}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}play.onclick=start;pause.onclick=()=>{if(s==='play')s='pause';else if(s==='pause')s='play'};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.key.toLowerCase()==='r')start()});c.addEventListener('pointerdown',jump);reset();requestAnimationFrame(loop)</script></body></html>
