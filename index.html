<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Geometry Dash Clone</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#001133;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.wrap{width:min(1120px,100vw);padding:10px;position:relative}canvas{width:100%;display:block;aspect-ratio:16/9;border:3px solid #08dfff;border-radius:10px;box-shadow:0 0 40px #00cfff88}.hud{position:absolute;top:22px;left:28px;right:28px;z-index:2;display:flex;justify-content:space-between;text-shadow:0 3px #000;pointer-events:none}.logo{font-weight:1000;font-size:clamp(18px,3vw,34px);color:#ffe33c;-webkit-text-stroke:2px #8a3b00;text-shadow:3px 4px #27142a}.small{font-size:11px;letter-spacing:2px;color:#bff8ff}.stats{text-align:right;font-weight:bold}.bar{position:absolute;top:72px;left:12%;width:76%;height:9px;border:2px solid #06142e;border-radius:9px;background:#ffffff55;z-index:3}.fill{display:block;height:100%;background:#39f477;width:0}.overlay{position:absolute;inset:0;z-index:4;display:grid;place-items:center;background:#0b124dcc}.hide{display:none!important}.card{width:min(650px,90%);padding:22px;text-align:center;background:#111947ee;border:3px solid #5cefff;border-radius:18px}.card h1{font-size:clamp(28px,6vw,58px);margin:4px;color:#ffe33c;-webkit-text-stroke:2px #793900;text-shadow:3px 4px #1b1230}.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0}.level{padding:8px 2px;background:#ffffff12;color:#fff;border:2px solid #ffffff55;border-radius:9px;font-size:11px;font-weight:bold}.level.sel{border-color:#fff23b;box-shadow:0 0 15px #fff23b}.level b{display:block;font-size:22px}.stars{color:#ffe33c}.btn{border:0;border-radius:30px;padding:13px 29px;background:linear-gradient(#6aff99,#12b950);box-shadow:0 5px #08752e;color:#032012;font-weight:bold;cursor:pointer}.pause{position:absolute;right:25px;top:25px;z-index:5;background:#101b49cc;color:#fff;border:0;font-size:18px}.hint{position:absolute;bottom:17px;z-index:2;width:100%;left:0;text-align:center;font-size:11px;color:#c9ddff}</style></head><body><main class="wrap"><canvas id="game" width="960" height="540"></canvas><div class="hud"><div><div class="logo">GEOMETRY DASH</div><div class="small" id="levelName">STEREO MADNESS · EASY</div></div><div class="stats">ATTEMPT <span id="attempt">1</span><br><span id="percent">0</span>%</div></div><div class="bar"><i class="fill" id="fill"></i></div><button class="pause hide" id="pause">Ⅱ</button><div id="menu" class="overlay"><div class="card"><h1>GEOMETRY DASH</h1><p>Jump and fly your way through danger!</p><div class="levels" id="levels"></div><button class="btn" id="play">PLAY</button><p>SPACE / UP / CLICK / TAP TO JUMP · R RESTART</p></div></div></main><script>'use strict';const c=document.querySelector('#game'),ctx=c.getContext('2d'),G=432,FIN=5600;let mode='menu',chosen=0,attempt=0,last=0,camera=0,flash=0,shake=0,player,things=[],particles=[],audio=null;const data=[['Stereo Madness','EASY',1,'#001133','#08aaff',145],['Back On Track','EASY',2,'#28004d','#e72dff',155],['Polargeist','NORMAL',3,'#003e55','#19e6d0',165],['Dry Out','NORMAL',4,'#5b2108','#ffb52e',145],['Base After Base','HARD',5,'#073d24','#55f542',175]];function renderLevels(){levels.innerHTML=data.map((v,i)=>`<button class="level ${i?'':'sel'}" data-i="${i}"><b>◆</b>${v[0]}<br><span class=stars>${'★'.repeat(v[2])}</span><br>${v[1]}</button>`).join('');document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;document.querySelectorAll('.level').forEach(z=>z.classList.remove('sel'));b.classList.add('sel')})}renderLevels();function sound(f,d=.12,t='square',v=.05){try{if(!audio)return;let o=audio.createOscillator(),a=audio.createGain();o.type=t;o.frequency.value=f;a.gain.setValueAtTime(v,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch(e){}}function reset(){player={x:120,y:G-38,w:36,h:36,vy:0,rot:0,onGround:true};camera=0;things=[];particles=[];let gap=chosen===0?145:175;for(let z=600;z<FIN;z+=gap){things.push({type:'spike',x:z,w:38,h:36});if(chosen===0&&z>950&&z%700<200)things.push({type:'spike',x:z+42,w:38,h:36});if(z>1200&&z%900<180)things.push({type:'block',x:z+65,w:72,h:55+(z%80)});if(z%800<150)things.push({type:'orb',x:z+112,w:24,h:24})}}function box(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function begin(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume()}catch(e){audio=null}attempt++;document.querySelector('#attempt').textContent=attempt;reset();mode='play';menu.classList.add('hide');pause.classList.remove('hide');levelName.textContent='GET READY · 3';let n=3;const timer=setInterval(()=>{n--;levelName.textContent=n?'GET READY · '+n:data[chosen][0].toUpperCase()+' · '+data[chosen][1];if(!n){clearInterval(timer);sound(220,.2,'sawtooth',.02)}},300)}function burst(x,y,col,n=35){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*520,vy:(Math.random()-.8)*520,l:.55,col})}function die(){if(mode!=='play')return;mode='respawning';flash=.3;shake=14;burst(player.x+18,player.y+18,data[chosen][4]);sound(70,.35,'sawtooth',.08);setTimeout(()=>{attempt++;document.querySelector('#attempt').textContent=attempt;reset();mode='play';levelName.textContent=data[chosen][0].toUpperCase()+' · '+data[chosen][1]},120)}function jump(){if(mode==='menu'){begin();return}if(mode==='play'&&player.onGround){player.vy=-870;player.onGround=false;sound(560);burst(player.x+18,player.y+36,'#ffe33c',8)}}function update(dt){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=800*dt;p.l-=dt});particles=particles.filter(p=>p.l>0);flash=Math.max(0,flash-dt);if(mode!=='play')return;player.vy+=2450*dt;player.y+=player.vy*dt;player.onGround=false;if(player.y>=G-player.h){player.y=G-player.h;player.vy=0;player.onGround=true;player.rot=Math.round(player.rot/(Math.PI/2))*Math.PI/2}for(const o of things){let r=o.type==='spike'?{x:o.x+5,y:G-o.h+8,w:28,h:28}:o.type==='block'?{x:o.x,y:G-o.h,w:o.w,h:o.h}:{x:o.x,y:G-120,w:24,h:24};if(o.type==='orb'&&box(player,r)){player.vy=-1040;sound(700)}else if(o.type!=='orb'&&box({x:player.x+5,y:player.y+5,w:26,h:26},r))return die()}player.x+=270*dt;player.rot=player.onGround?player.rot:player.rot+dt*8;camera=Math.max(0,player.x-180);let pct=Math.min(100,player.x/FIN*100);percent.textContent=pct|0;fill.style.width=pct+'%';if(player.x>FIN){mode='menu';menu.classList.remove('hide');pause.classList.add('hide')}}function draw(){let L=data[chosen],grad=ctx.createLinearGradient(0,0,0,540);grad.addColorStop(0,L[3]);grad.addColorStop(1,'#09102e');ctx.fillStyle=grad;ctx.fillRect(0,0,960,540);ctx.save();if(shake){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.86}ctx.translate(-camera,0);for(let i=-2;i<60;i++){ctx.fillStyle=i%2?'#fff2':'#0066ff55';ctx.fillRect(i*100,90+(i%5)*35,3,3)}ctx.fillStyle='#101634';ctx.fillRect(0,G,FIN+500,108);ctx.fillStyle=L[4];ctx.fillRect(0,G,FIN+500,6);for(let i=0;i<80;i++){ctx.fillStyle=i%2?'#fff3':'#0005';ctx.fillRect(i*70,G+15,35,5)}things.forEach(o=>{if(o.type==='spike'){ctx.fillStyle='#252735';ctx.strokeStyle='#d9e5ff';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x,G);ctx.lineTo(o.x+19,G-o.h);ctx.lineTo(o.x+38,G);ctx.closePath();ctx.fill();ctx.stroke();ctx.strokeStyle='#73829d';ctx.beginPath();ctx.moveTo(o.x+19,G-27);ctx.lineTo(o.x+13,G-8);ctx.stroke()}else if(o.type==='block'){ctx.fillStyle='#494b76';ctx.fillRect(o.x,G-o.h,o.w,o.h);ctx.strokeStyle=L[4];ctx.lineWidth=4;ctx.strokeRect(o.x,G-o.h,o.w,o.h);ctx.strokeStyle='#a8b9de';ctx.lineWidth=2;ctx.strokeRect(o.x+8,G-o.h+8,o.w-16,o.h-16)}else{ctx.fillStyle='#ffe33c';ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(o.x+12,G-108,12,0,7);ctx.fill();ctx.stroke()}});if(mode==='play'||mode==='respawning'){ctx.save();ctx.translate(player.x+18,player.y+18);ctx.rotate(player.rot);ctx.fillStyle='#b9ff38';ctx.strokeStyle='#08e1ff';ctx.lineWidth=4;ctx.fillRect(-18,-18,36,36);ctx.strokeRect(-18,-18,36,36);ctx.fillStyle='#11152f';ctx.fillRect(-10,-8,7,8);ctx.fillRect(3,-8,7,8);ctx.fillRect(-8,5,17,4);ctx.restore()}particles.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l*2);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,6,6);ctx.globalAlpha=1});ctx.restore();if(flash){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,960,540)}}function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}play.onclick=begin;pause.onclick=()=>{if(mode==='play')mode='pause';else if(mode==='pause')mode='play'};addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}if(e.key.toLowerCase()==='r')begin()});c.addEventListener('pointerdown',jump);reset();requestAnimationFrame(loop)</script></body></html>
