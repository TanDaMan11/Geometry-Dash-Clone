<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#001030;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}main{position:relative;width:min(1120px,100vw);height:min(630px,100vh);overflow:hidden;background:radial-gradient(circle at 50% 35%,#073c96,#06215e 42%,#16072e);border:3px solid #00eaff;box-shadow:0 0 40px #00eaff88}.grid{position:absolute;inset:0;opacity:.2;background-image:linear-gradient(45deg,transparent 48%,#55bfff 49%,transparent 51%),linear-gradient(-45deg,transparent 48%,#55bfff 49%,transparent 51%);background-size:80px 80px;animation:move 8s linear infinite}@keyframes move{to{background-position:80px 80px}}.logo{text-align:center;margin:32px auto 8px;font-size:clamp(34px,7vw,82px);font-weight:1000;letter-spacing:-5px;color:#ffe83b;-webkit-text-stroke:5px #111;text-shadow:0 8px #e27b00,5px 12px #000,0 0 18px #ffd21f;transform:perspective(400px) rotateX(10deg)}.home,.levels{position:relative;z-index:1;text-align:center}.center{display:flex;justify-content:center;align-items:center;gap:34px;margin-top:40px}.icon{border:5px solid #121a2e;box-shadow:inset 0 0 0 4px #bde4ff,0 7px #050817,0 0 22px #00dfff88;cursor:pointer}.garage{width:108px;height:108px;background:#ffe234;border-radius:18px;font-size:55px}.play{width:172px;height:172px;border-radius:50%;background:radial-gradient(circle at 35% 25%,#baff68,#22c947 58%,#078221);font-size:0}.play:after{content:'';display:inline-block;border-left:50px solid #ffe83b;border-top:31px solid transparent;border-bottom:31px solid transparent;margin-left:13px;filter:drop-shadow(3px 4px #111)}.create{width:108px;height:108px;border-radius:50%;background:#268ce8;font-size:52px}.bottom{display:flex;justify-content:center;gap:18px;margin-top:62px}.utility{width:66px;height:66px;border-radius:12px;background:#238de6;color:#ffe83b;font-size:34px;border:4px solid #111a2f;box-shadow:inset 0 0 0 3px #9ceaff,0 5px #050817;cursor:pointer}.side{position:absolute;z-index:2;right:24px;top:255px;width:70px;height:70px;border-radius:16px;background:#f6c62d;border:4px solid #17213b;font-size:37px;box-shadow:0 0 20px #ffe12d}.music{position:absolute;z-index:2;left:24px;top:25px;background:none;border:0;color:#ffe83b;font-size:30px;cursor:pointer}.levels{display:none;position:absolute;inset:0;background:#07184fee;padding:30px}.levels.show{display:block}.levels h2{font-size:42px;color:#ffe83b;text-shadow:3px 4px #000}.cards{display:flex;justify-content:center;gap:10px}.level{width:150px;padding:15px;color:#fff;background:#164cbd;border:3px solid #ffe83b;border-radius:12px;font-weight:bold;cursor:pointer}.back{margin-top:45px}.btn{border:0;border-radius:30px;padding:13px 29px;background:linear-gradient(#69ff99,#12b852);box-shadow:0 5px #08752e;font-weight:bold;cursor:pointer}.hint{position:absolute;bottom:10px;width:100%;text-align:center;color:#bcecff;font-size:11px}</style></head><body><main><div class=grid></div><button class=music id=music>♫</button><section class=home id=home><div class=logo>GEOMETRY DASH</div><div class=center><button class="icon garage" title="Icon Kit">◆</button><button class="icon play" id=play title=Play></button><button class="icon create" title=Create>⚒</button></div><button class=side title="Daily Chest">♜</button><div class=bottom><button class=utility>♜</button><button class=utility>◆</button><button class=utility>⚙</button><button class=utility>ⓘ</button></div><div class=hint>SELECT A LEVEL TO PLAY</div></section><section class=levels id=levels><h2>SELECT LEVEL</h2><div class=cards><button class=level data-level="Stereo Madness">◆<br>STEREO MADNESS<br>★ EASY</button><button class=level data-level="Back On Track">◆<br>BACK ON TRACK<br>★★ EASY</button><button class=level data-level=Polargeist>◆<br>POLTERGEIST<br>★★★ NORMAL</button></div><button class="btn back" id=back>BACK</button></section><script>const home=document.querySelector('#home'),levels=document.querySelector('#levels');play.onclick=()=>{home.style.display='none';levels.classList.add('show')};back.onclick=()=>{levels.classList.remove('show');home.style.display='block'};document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{b.textContent='STARTING '+b.dataset.level+'…';setTimeout(()=>b.textContent=b.dataset.level+' · RUNNING',450)});music.onclick=()=>music.textContent=music.textContent==='♫'?'🔇':'♫'</script></main></body></html>
