<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Geometry Dash Clone</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#070b36;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center}main{width:min(1100px,100vw);height:min(620px,100vh);position:relative;overflow:hidden;background:#123d91;border:3px solid #09eaff;box-shadow:0 0 35px #09eaff}.home{text-align:center;padding:30px 10px}.logo{font-weight:900;font-size:clamp(35px,7vw,78px);color:#ffe83b;text-shadow:0 7px #d87500,4px 10px #111;-webkit-text-stroke:4px #111}.buttons{display:flex;justify-content:center;align-items:center;gap:28px;margin:38px}.btn{cursor:pointer;border:5px solid #111a33;box-shadow:inset 0 0 0 4px #cdf5ff,0 7px #050817,0 0 24px #00eaff;border-radius:18px}.kit{width:105px;height:105px;background:#f0c51e;color:#152040;font-size:52px}.play{width:175px;height:175px;border-radius:50%;background:radial-gradient(#d4ff84,#22c94b 60%,#08782b);font-size:0}.play:after{content:'';display:inline-block;border-left:55px solid #ffe83b;border-top:35px solid transparent;border-bottom:35px solid transparent;margin-left:13px;filter:drop-shadow(3px 3px #111)}.create{width:105px;height:105px;border-radius:50%;background:linear-gradient(145deg,#61cfff,#1265c4);font-size:46px;color:#eaf7ff}.screen{display:none;position:absolute;inset:0;text-align:center;padding:25px;background:#061748ee}.screen.show{display:block}.card{width:min(450px,80vw);margin:35px auto;padding:25px;background:linear-gradient(#397fdb,#12358a);border:4px solid #ffe83b;border-radius:18px}.action{padding:13px 28px;border:0;border-radius:24px;background:#20c957;color:#fff;font-weight:bold;cursor:pointer}.back{position:absolute;left:16px;bottom:16px}.game{padding:0!important}.game canvas{width:100%;height:100%}.hud{position:absolute;top:13px;left:20px;right:20px;display:flex;justify-content:space-between;text-shadow:0 3px #000}</style></head><body><main><section id=home class=home><div class=logo>GEOMETRY DASH</div><div class=buttons><button class="btn kit" aria-label="Icon garage">◆</button><button class="btn play" id=play aria-label="Play"></button><button class="btn create" aria-label="Create">⚒</button></div><div style="font-size:34px;color:#ffe83b">♜　◆　⚙　ⓘ</div></section><section id=levels class=screen><h1>SELECT LEVEL</h1><div class=card><h2>STEREO MADNESS</h2><p>★ EASY　 NORMAL ▰▱▱▱▱</p><button class=action id=start>PLAY</button></div><button class="action back" id=levelBack>HOME</button></section><section id=game class="screen game"><canvas id=c width=960 height=540></canvas><div class=hud><b>STEREO MADNESS</b><span>ATTEMPT <b id=attempt>1</b> · <b id=pct>0</b>%</span></div><button class="action back" id=quit>LEVELS</button></section></main><script>const $=id=>document.getElementById(id),x=window.c.getContext('2d');let p,platforms,spikes,dead=false,last=0;play.onclick=()=>{home.style.display='none';levels.classList.add('show')};levelBack.onclick=()=>{levels.classList.remove('show');home.style.display='block'};quit.onclick=()=>{game.classList.remove('show');levels.classList.add('show')};start.onclick=()=>{levels.classList.remove('show');game.classList.add('show');reset()};function reset(){p={x:100,y:400,w:32,h:32,vy:0,on:true};platforms=[{x:500,y:335,w:75,h:97},{x:720,y:285,w:80,h:147},{x:970,y:350,w:110,h:82},{x:1240,y:300,w:85,h:132}];spikes=[380,620,860,1130].map(x=>({x,y:396,w:38,h:36}));dead=false}function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}function die(){if(dead)return;dead=true;setTimeout(()=>{reset();attempt.textContent=+attempt.textContent+1},350)}function jump(){if(!dead&&p.on){p.vy=-860;p.on=false}}addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump()}});c.onpointerdown=jump;function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(game.classList.contains('show')&&!dead){let old=p.y+p.h;p.vy+=2300*dt;p.y+=p.vy*dt;p.on=false;if(p.y+p.h>=432){p.y=400;p.vy=0;p.on=true}for(const b of platforms)if(hit(p,b)){if(p.vy>=0&&old<=b.y+10){p.y=b.y-p.h;p.vy=0;p.on=true}else if(p.x+p.w>b.x&&p.x<b.x+12)die()}for(const s of spikes)if(hit({x:p.x+6,y:p.y+6,w:20,h:22},s))die();p.x+=275*dt;pct.textContent=Math.min(100,p.x/1550*100)|0}draw();requestAnimationFrame(loop)}function draw(){x.fillStyle='#123f96';x.fillRect(0,0,960,540);x.save();x.translate(-Math.max(0,p.x-170),0);x.fillStyle='#001848';x.fillRect(0,432,2600,108);x.fillStyle='#00eaff';x.fillRect(0,432,2600,6);platforms.forEach(b=>{x.fillStyle='#3d4c7c';x.strokeStyle='#32eaff';x.lineWidth=3;x.fillRect(b.x,b.y,b.w,b.h);x.strokeRect(b.x,b.y,b.w,b.h)});spikes.forEach(s=>{x.fillStyle='#151827';x.strokeStyle='#00eaff';x.beginPath();x.moveTo(s.x,432);x.lineTo(s.x+19,s.y);x.lineTo(s.x+38,432);x.closePath();x.fill();x.stroke()});x.fillStyle='#ffe43b';x.strokeStyle='#19e5df';x.lineWidth=4;x.fillRect(p.x,p.y,p.w,p.h);x.strokeRect(p.x,p.y,p.w,p.h);x.restore()}reset();requestAnimationFrame(loop)</script></main></body></html>
